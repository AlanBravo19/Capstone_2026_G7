<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RutaAlerta · Centro de operaciones</title><link rel="stylesheet" href="/operaciones.css"><script src="/operaciones.js" defer></script></head><body>
<header><strong class="brand"><i aria-hidden="true">R</i>RutaAlerta</strong><span class="suite">Centro de operaciones</span><div class="user" hidden><span id="name"></span><button id="exit">Cerrar sesión</button></div></header>
<main id="access"><section class="identity"><div class="route-art" aria-hidden="true"><span></span><span></span><span></span></div><div><small>Acceso institucional</small><h1>Centro de<br>operaciones</h1><p>Revisa reportes, contrasta avistamientos y da seguimiento a los casos de tu organización.</p></div></section>
<section class="signin"><h2>Ingreso de operador</h2><p>Usa la cuenta asociada a tu organización.</p><form id="login"><label>Correo institucional o de acceso<input name="correo" type="email" required autocomplete="username"></label><label>Contraseña<input name="clave" type="password" autocomplete="current-password" required></label><button class="primary">Ingresar al panel</button></form>
<form id="mfa" hidden><label>Código de autenticación o recuperación<input name="codigo" required autocomplete="one-time-code"></label><button class="primary">Verificar e ingresar</button><button type="button" id="back">Volver al ingreso</button></form><a class="smalllink" href="/ciudadania">Crear cuenta ciudadana o recuperar acceso</a></section></main>
<div id="desk" hidden><aside><nav aria-label="Navegación institucional"><button data-view="cases">Bandeja de casos</button><button data-view="sources">Fuentes territoriales</button><button data-view="cameras">Cámaras autorizadas</button></nav></aside><main class="workspace"><div class="page-head"><div><small>Operaciones</small><h1 id="title"></h1></div><button id="refresh">Actualizar</button></div><div id="content" aria-busy="false"></div></main></div>
<p id="status" role="status" aria-live="polite"></p></body></html>
