<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>RutaAlerta Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra de prototipo fija arriba; ciudadanía = teléfono + panel de notas; institución = barra lateral + área de trabajo. */
:root{
  --bg:#E8ECEE; --surface:#FFFFFF; --surface-2:#F3F6F7; --sunken:#E0E6E9;
  --ink:#13202A; --ink-2:#465865; --ink-3:#6E7F8A; --line:#D2DADE;
  --accent:#0B5D75; --accent-hover:#084B5F; --accent-ink:#FFFFFF; --accent-soft:#D8EBF1;
  --good:#1E744A; --good-soft:#DAEFE2; --warn:#8F5E07; --warn-soft:#FAEACA; --bad:#AD3333; --bad-soft:#F6DDDB;
  --signal:#E5B21F; --water:#B9D6E1; --land:#F0F3F1; --land-line:#D5DCD8; --bezel:#13202A;
  --shadow:0 1px 2px rgba(19,32,42,.06),0 12px 32px rgba(19,32,42,.10);
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1419; --surface:#142028; --surface-2:#192833; --sunken:#0F1A21;
  --ink:#E3ECF0; --ink-2:#A3B4BF; --ink-3:#7D909C; --line:#283945;
  --accent:#5CB7D2; --accent-hover:#7CC6DC; --accent-ink:#04212B; --accent-soft:#12333E;
  --good:#5BC98F; --good-soft:#123021; --warn:#E5B657; --warn-soft:#342711; --bad:#EF8484; --bad-soft:#3A1818;
  --signal:#E5B21F; --water:#1C3B47; --land:#17242C; --land-line:#23333D; --bezel:#04080B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1419; --surface:#142028; --surface-2:#192833; --sunken:#0F1A21;
  --ink:#E3ECF0; --ink-2:#A3B4BF; --ink-3:#7D909C; --line:#283945;
  --accent:#5CB7D2; --accent-hover:#7CC6DC; --accent-ink:#04212B; --accent-soft:#12333E;
  --good:#5BC98F; --good-soft:#123021; --warn:#E5B657; --warn-soft:#342711; --bad:#EF8484; --bad-soft:#3A1818;
  --signal:#E5B21F; --water:#1C3B47; --land:#17242C; --land-line:#23333D; --bezel:#04080B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.12;letter-spacing:.005em}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.9em;letter-spacing:-.01em}
.eyebrow{font:600 11px/1.2 var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.quiet{color:var(--ink-2)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.oculto{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

/* Barra del prototipo */
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:10px;font:700 21px/1 var(--f-display)}
.pchip{font:600 11px/1 var(--f-display);letter-spacing:.07em;text-transform:uppercase;padding:6px 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.sp{flex:1}
.who{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;font-size:13px;color:var(--ink-2)}
.who strong{color:var(--ink);font-size:14px}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;transition:background .15s,border-color .15s;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-p:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-d{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn-d:hover{background:var(--bad-soft)}
.btn-s{min-height:32px;padding:0 12px;font-size:13px}
.btn-l{min-height:50px;font-size:16px;border-radius:12px}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:left}

/* Insignias */
.b{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font:600 12px/1.35 var(--f-body);white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.b::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.b-info{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.b-good{background:var(--good-soft);color:var(--good);border-color:transparent}
.b-warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.b-bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}

/* Formularios */
.campo{display:flex;flex-direction:column;gap:6px;min-width:0}
.campo>span{font-size:13px;font-weight:600;color:var(--ink-2)}
.inp{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
textarea.inp{min-height:86px;resize:vertical}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.ayuda{font-size:12.5px;color:var(--ink-3)}
.error{color:var(--bad);font-size:13.5px;font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.interruptor{position:relative;width:44px;height:26px;border-radius:13px;border:1px solid var(--line);background:var(--sunken);cursor:pointer;flex:none;padding:0}
.interruptor::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--ink-3);transition:left .15s}
.interruptor[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.interruptor[aria-checked="true"]::after{left:21px;background:var(--accent-ink)}

/* Tarjetas y avisos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{font-size:18px}
.card-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.aviso{border-radius:var(--r);padding:12px 14px;font-size:14px;border:1px solid transparent;display:flex;flex-direction:column;gap:4px}
.aviso strong{font-weight:700}
.aviso-warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.aviso-good{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.aviso-info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.aviso-bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.aviso-neutro{background:var(--surface-2);border-color:var(--line)}
.pila{display:flex;flex-direction:column;gap:12px;min-width:0}
.pila-s{display:flex;flex-direction:column;gap:8px;min-width:0}
.fila{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.entre{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dato{display:grid;grid-template-columns:130px minmax(0,1fr);gap:4px 12px;font-size:14px}
.dato dt{color:var(--ink-3)}
.dato dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* Ingreso */
.ingreso{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:56px;max-width:1160px;margin:0 auto;padding:56px 24px 64px;align-items:start}
.hero{display:flex;flex-direction:column;gap:22px;padding-top:12px}
.hero h1{font-size:clamp(36px,4.6vw,56px);font-weight:700;letter-spacing:-.005em}
.hero .lead{font-size:18px;color:var(--ink-2);max-width:56ch}
.ruta{width:100%;max-width:560px;height:auto}
.ruta text{font:700 14px var(--f-display);letter-spacing:.06em;text-transform:uppercase;fill:var(--ink)}
.ruta .sub{font:500 12.5px var(--f-body);letter-spacing:0;text-transform:none;fill:var(--ink-2)}
.acceso{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:18px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px}
.tabs button{min-height:38px;border:0;border-radius:7px;background:transparent;font-weight:600;cursor:pointer;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.demo-lista{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.demo-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 14px;background:var(--surface);border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer}
.demo-item:last-child{border-bottom:0}
.demo-item:hover{background:var(--surface-2)}
.demo-item strong{font-size:14.5px}
.demo-item span{font-size:12.5px;color:var(--ink-3);grid-column:1}
.demo-item em{font-style:normal;grid-row:1 / span 2;grid-column:2;font:600 12px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}

/* App ciudadana */
.ciudadano{display:grid;grid-template-columns:auto minmax(0,360px);justify-content:center;gap:44px;padding:32px 20px 56px;align-items:start}
.telefono{width:392px;height:800px;border-radius:46px;background:var(--surface);border:11px solid var(--bezel);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative}
.t-estado{height:30px;display:flex;align-items:center;justify-content:space-between;padding:6px 24px 0;font:600 12.5px var(--f-body);color:var(--ink-2);flex:none}
.t-cab{padding:8px 16px 10px;display:flex;align-items:center;gap:6px;flex:none;border-bottom:1px solid var(--line)}
.t-cab h2{font-size:23px;font-weight:700}
.t-volver{width:36px;height:36px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink);margin-left:-8px}
.t-volver:hover{background:var(--surface-2)}
.t-main{flex:1;overflow-y:auto;padding:14px 16px 22px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
.t-tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px));flex:none}
.t-tab{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:5px 0;font:600 11px var(--f-body);color:var(--ink-3);cursor:pointer;position:relative}
.t-tab[aria-current="page"]{color:var(--accent)}
.punto-rojo{position:absolute;top:2px;right:calc(50% - 16px);min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;padding:0 4px}
.notas{position:sticky;top:84px;display:flex;flex-direction:column;gap:16px}
.notas h3{font-size:24px}
.notas ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;color:var(--ink-2)}
.prueba{border-left:3px solid var(--signal);padding:8px 12px;background:var(--surface);border-radius:0 8px 8px 0;font-size:14px}
.saludo h3{font-size:26px}
.accesos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acc{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;min-height:96px}
.acc:hover{border-color:var(--accent)}
.acc strong{font-size:14.5px}
.acc span{font-size:12.5px;color:var(--ink-3)}
.acc svg{color:var(--accent)}
.pasos-cab{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pasos-cab div{height:5px;border-radius:3px;background:var(--sunken)}
.pasos-cab div.on{background:var(--accent)}
.folio{font:500 19px var(--f-mono);letter-spacing:-.01em}
.linea-t{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.linea-t li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;position:relative;padding-bottom:14px}
.linea-t li:last-child{padding-bottom:0}
.linea-t li::before{content:"";position:absolute;left:10px;top:18px;bottom:0;width:2px;background:var(--line)}
.linea-t li:last-child::before{display:none}
.linea-t i{width:14px;height:14px;border-radius:50%;margin:3px 4px 0;border:2px solid var(--ink-3);background:var(--surface);z-index:1}
.linea-t li.hecho i{background:var(--good);border-color:var(--good)}
.linea-t li.actual i{background:var(--accent-soft);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.linea-t li.actual strong{color:var(--accent)}
.ev{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ev-n{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev small{grid-column:1 / -1;color:var(--ink-3);font-size:12px}
.sol{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px}
.foto-ph{width:64px;height:52px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-3)}
.mapa{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--line);background:var(--land);touch-action:manipulation}
.mapa-pick{cursor:crosshair}
.trabajo .mapa{max-width:560px}
.mapa .etq{font:600 9.5px var(--f-display);letter-spacing:.02em;fill:var(--ink-2);pointer-events:none}
.mapa .etq-num{font:700 8.5px var(--f-display);fill:var(--ink);pointer-events:none}
.ley{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.ley i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.rango{width:100%;accent-color:var(--accent)}

/* Panel institucional */
.panel{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 60px)}
.lado{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.lado-org{padding:4px 10px 16px;display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px}
.lado-org strong{font:700 17px/1.2 var(--f-display)}
.lado-item{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px;padding:0 12px;border-radius:8px;border:0;background:transparent;font-weight:600;color:var(--ink-2);cursor:pointer;text-align:left}
.lado-item:hover{background:var(--surface-2);color:var(--ink)}
.lado-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.cuenta{min-width:22px;height:22px;border-radius:11px;background:var(--warn-soft);color:var(--warn);font-size:12px;display:grid;place-items:center;padding:0 6px}
.lado-pie{margin-top:auto;padding:12px 10px 0;font-size:12.5px;color:var(--ink-3)}
.trabajo{padding:26px 30px 56px;display:flex;flex-direction:column;gap:18px;min-width:0;max-width:1320px}
.titulo-pag{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.titulo-pag h1{font-size:32px;font-weight:700}
.titulo-pag p{color:var(--ink-2);max-width:72ch;margin-top:4px}
.resumen{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.cifra{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.cifra strong{font:700 30px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.cifra span{font-size:13px;color:var(--ink-2)}
.cifra.alerta strong{color:var(--warn)}
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filtros .campo{width:auto}
.filtros .inp{min-height:38px;padding:6px 10px}
.tabla-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 11.5px/1.2 var(--f-display);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:11px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.fila-clic{cursor:pointer}
tr.fila-clic:hover{background:var(--surface-2)}
.col2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.col2b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.cola{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;align-items:start}
.cola-item{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.cola-item[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.bitacora{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.bitacora li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.bitacora li:last-child{border-bottom:0}
.bitacora small{color:var(--ink-3);grid-column:1 / -1}
.barra-ind{display:grid;grid-template-columns:150px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13.5px}
.pista{height:10px;border-radius:5px;background:var(--sunken);overflow:hidden}
.pista div{height:100%;border-radius:5px;background:var(--accent)}
.ind-pie{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px;font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.grande{font:700 34px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.denegado{max-width:560px;margin:40px auto;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.denegado .codigo{font:700 64px/1 var(--f-display);color:var(--bad)}

/* Guía y avisos flotantes */
.guia-fondo{position:fixed;inset:0;background:rgba(8,16,22,.5);z-index:50}
.guia{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:51;padding:calc(22px + env(safe-area-inset-top,0px)) 22px 28px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.guia ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:p}
.guia li{counter-increment:p;display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 10px;padding:12px;border:1px solid var(--line);border-radius:10px}
.guia li::before{content:counter(p);grid-row:1 / span 3;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 14px var(--f-display)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;z-index:60;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:1100px){.col2,.cola{grid-template-columns:minmax(0,1fr)}.resumen{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.ingreso{grid-template-columns:minmax(0,1fr);gap:28px;padding:28px 16px 40px}.hero{padding-top:0}}
@media (max-width:860px){
  .ciudadano{grid-template-columns:minmax(0,1fr);padding:0;gap:0}
  .telefono{width:100%;height:auto;min-height:calc(100vh - 60px);border:0;border-radius:0;box-shadow:none}
  .t-estado{display:none}
  .t-main{overflow:visible}
  .t-tabs{position:sticky;bottom:0}
  .notas{position:static;padding:20px 16px 32px}
  .panel{grid-template-columns:minmax(0,1fr)}
  .lado{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px;align-items:center}
  .lado-org,.lado-pie{display:none}
  .trabajo{padding:18px 16px 40px}
  .col2b{grid-template-columns:minmax(0,1fr)}
  .barra-ind{grid-template-columns:110px minmax(0,1fr) 30px}
  .who{display:none}
}
@media (max-width:420px){.accesos{grid-template-columns:minmax(0,1fr)}.dato{grid-template-columns:minmax(0,1fr)}.resumen{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}

function Mapa({ punto, precision, onPick, sector, calor, extras, capa }) {
  const ref = useRef(null);

  const relleno = s => {
    if (calor) { const n = calor[s.id] || 0; return n >= 3 ? { fill: 'var(--accent)', fillOpacity: 0.42 } : n === 2 ? { fill: 'var(--accent)', fillOpacity: 0.2 } : { fill: 'var(--warn-soft)', fillOpacity: 1 }; }

    return { fill: 'var(--land)', fillOpacity: 1 };
  };
  return html`<svg ref=${ref} viewBox="0 0 360 240" className=${'mapa' + (onPick ? ' mapa-pick' : '')} onClick=${clic} role="img" aria-label=${onPick ? 'Mapa esquemático: toca para marcar la ubicación' : 'Mapa esquemático del Gran Concepción'}>

function Subir({ onArchivo, etiqueta }) {
  const [cargas, setCargas] = useState([]);
  const id = useRef('arch-' + hexAzar(3)).current;
  async function elegir(e) {
    const files = Array.from(e.target.files || []); e.target.value = '';
    for (const file of files) {
      const k = uuid();
      if (file.size > 25 * 1048576) { setCargas(c => c.concat({ k, nombre: file.name, estado: 'error', msg: 'Supera 25 MB: elige un archivo más liviano.' })); continue; }
      setCargas(c => c.concat({ k, nombre: file.name, estado: 'cargando' }));
      const sha = await sha256(await file.arrayBuffer());
      await new Promise(r => setTimeout(r, 650));
      onArchivo({ nombre: file.name, tipo: file.type.indexOf('video') === 0 ? 'video' : file.type.indexOf('image') === 0 ? 'foto' : 'documento', bytes: file.size, sha: sha || hexAzar(32).toLowerCase() });
      setCargas(c => c.filter(x => x.k !== k));
    }
  }
  return html`<div className="pila-s">
    ${cargas.map(c => html`<div key=${c.k} className="ev"><span className="ev-n">${c.nombre}</span><${Insignia} tipo="carga" valor=${c.estado} />${c.msg ? html`<small>${c.msg}</small>` : null}</div>`)}

    <input id=${id} type="file" accept="image/*,video/*" multiple className="oculto" onChange=${elegir} />
  </div>`;
}

function Ingreso({ db, act, entrar }) {

    act((d, t) => auditar(d, t, u ? u.id : null, 'Iniciar sesión', normCorreo(c) || 'sin correo', valido ? 'exito' : 'denegado'));

  }

    if (clave.length < 8) return setError('La contraseña debe tener al menos 8 caracteres.');
