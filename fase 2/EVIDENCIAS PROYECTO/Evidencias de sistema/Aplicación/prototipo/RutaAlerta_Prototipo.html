/* ---------------- Geometría y capas del mapa ---------------- */
const largoRuta = pts => pts.slice(1).reduce((s, p, i) => s + Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]), 0);
function puntoEn(pts, f) {
  const total = largoRuta(pts); let falta = total * cl(f);
  for (let i = 1; i < pts.length; i++) { const a = pts[i - 1], b = pts[i]; const l = Math.hypot(b[0] - a[0], b[1] - a[1]); if (falta <= l) { const k = l ? falta / l : 0; return { x: a[0] + (b[0] - a[0]) * k, y: a[1] + (b[1] - a[1]) * k, i }; } falta -= l; }
  const z = pts[pts.length - 1]; return { x: z[0], y: z[1], i: pts.length - 1 };
}
function cl(x) { return Math.max(0, Math.min(1, x)); }
function distSegmento(p, a, b) { const dx = b[0] - a[0], dy = b[1] - a[1]; const L2 = dx * dx + dy * dy || 1; const t = cl(((p.x - a[0]) * dx + (p.y - a[1]) * dy) / L2); return { d: Math.hypot(p.x - (a[0] + dx * t), p.y - (a[1] + dy * t)), t, L: Math.sqrt(L2) }; }
const azar = s => { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return ((h >>> 0) % 10000) / 10000; };
const fHoraSeg = t => new Date(t).toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

const capaRuta = (pts, f) => { const p = puntoEn(pts, f); const hecho = pts.slice(0, p.i).concat([[p.x, p.y]]);
  return html`<g><polyline points=${pts.map(q => q.join(',')).join(' ')} fill="none" stroke="var(--ink-3)" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="1 6" />
    ${hecho.length > 1 ? html`<polyline points=${hecho.map(q => q.join(',')).join(' ')} fill="none" stroke="var(--accent)" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" />` : null}</g>`; };
const capaPuntos = puntos => puntos.map(p => html`<g key=${p.lugar}><circle cx=${p.x} cy=${p.y} r="9" fill="var(--warn)" fillOpacity=${p.pendiente ? 0.06 : 0.22} stroke="var(--warn)" strokeWidth="1.3" strokeDasharray=${p.pendiente ? '3 2' : 'none'} /><text x=${p.x} y=${p.y + 3} textAnchor="middle" className="etq-num">${p.n}</text></g>`);
const capaPosicion = p => html`<g><circle cx=${p.x} cy=${p.y} r="11" fill="var(--accent)" fillOpacity="0.18" /><circle cx=${p.x} cy=${p.y} r="5.5" fill="var(--accent)" stroke="var(--surface)" strokeWidth="2" /></g>`;
function cono(k, r) { const a1 = (k.dir - 32) * Math.PI / 180, a2 = (k.dir + 32) * Math.PI / 180; return `M${k.x} ${k.y} L${k.x + r * Math.cos(a1)} ${k.y + r * Math.sin(a1)} A${r} ${r} 0 0 1 ${k.x + r * Math.cos(a2)} ${k.y + r * Math.sin(a2)} Z`; }
const capaCamaras = (cams, recs) => cams.map(k => { const rec = recs && recs.find(r => r.cam === k.id); const on = rec && (!rec.decision || rec.decision.tipo === 'aceptado'); const col = k.estado !== 'disponible' ? 'var(--ink-3)' : on ? 'var(--accent)' : 'var(--ink-2)';
  return html`<g key=${k.id}><path d=${cono(k, 16)} fill=${col} fillOpacity=${on ? 0.2 : 0.08} /><rect x=${k.x - 5} y=${k.y - 5} width="10" height="10" rx="2" fill=${col} stroke="var(--surface)" strokeWidth="1.2" /><text x=${k.x + 8} y=${k.y - 7} className="etq-num">${'C' + k.num}</text></g>`; });
const capaCorredores = cs => cs.map((c, i) => html`<g key=${c.id}><polyline points=${c.pts.map(q => q.join(',')).join(' ')} fill="none" stroke="var(--accent)" strokeWidth="2.4" strokeDasharray="6 4" strokeOpacity="0.85" /><text x=${c.pts[1][0] + (c.pts[1][0] > 300 ? -14 : 6)} y=${c.pts[1][1] + (c.pts[1][1] < 20 ? 12 : -4)} className="etq-num">${i + 1}</text></g>`);
const capaAncla = a => a ? html`<g><path d=${`M${a.x} ${a.y - 8} L${a.x + 7} ${a.y} L${a.x} ${a.y + 8} L${a.x - 7} ${a.y} Z`} fill="var(--signal)" stroke="var(--surface)" strokeWidth="1.4" /></g>` : null;
const capaObs = obs => (obs || []).map((o, i) => html`<circle key=${'o' + i} cx=${o.x} cy=${o.y} r="5" fill="var(--good)" stroke="var(--surface)" strokeWidth="1.4" />`);

/* ---------------- Fuentes históricas y avisos territoriales ---------------- */
function puntosHistoricos(d, estado) {
  const ids = new Set(d.lotes.filter(l => l.estado === estado).map(l => l.id));
  const g = {};
  d.hechos.filter(h => ids.has(h.lote) && h.fecha >= Date.now() - 365 * DIA).forEach(h => { (g[h.lugar] = g[h.lugar] || []).push(h); });
  return Object.keys(g).map(k => {
    const hs = g[k]; const lote = d.lotes.find(l => l.id === hs[0].lote); const fu = d.fuentes.find(f => f.id === lote.fuente);
    const tipos = {}; hs.forEach(h => { tipos[h.tipo] = (tipos[h.tipo] || 0) + 1; });
    return { lugar: k, x: hs.reduce((s, h) => s + h.x, 0) / hs.length, y: hs.reduce((s, h) => s + h.y, 0) / hs.length, n: hs.length, tipo: Object.keys(tipos).sort((a, b) => tipos[b] - tipos[a])[0], fuente: fu.nombre, corte: lote.t, pendiente: estado !== 'validado' };
  }).filter(p => p.n >= 2);
}
const RUTAS_TRAYECTO = [
  { id: 'r1', nombre: 'Del trabajo a la casa', desde: 'Concepción Centro', hasta: 'San Pedro de la Paz', pts: [[322, 30], [264, 34], [228, 40], [206, 72], [190, 112], [176, 150], [150, 176], [112, 200], [78, 214]] },

];
function setPreferencia(d, t, uid, k, v) { const p = prefsDe(d, uid); p[k] = v; d.prefs[uid] = p; d.consent[uid] = Object.assign({}, d.consent[uid], { [k]: { activo: v, version: '1.0', t } }); auditar(d, t, uid, v ? 'Otorgar consentimiento' : 'Revocar consentimiento', `${k} · versión 1.0`); }

function Trayecto({ db, act, u, ir, avisar }) {
  const pr = prefsDe(db, u.id);
  const [ruta, setRuta] = useState('r1');
  const [activo, setActivo] = useState(false);
  const [f, setF] = useState(0);
  const [vel, setVel] = useState(2);
  const [avisos, setAvisos] = useState([]);
  const [actual, setActual] = useState(null);
  const [fin, setFin] = useState(false);
  const fRef = useRef(0); const vistos = useRef(new Set());
  const R = RUTAS_TRAYECTO.find(r => r.id === ruta);
  const puntos = puntosHistoricos(db, 'validado');
  useEffect(() => {
    if (!activo) return;
    const iv = setInterval(() => {
      const nf = Math.min(1, fRef.current + 0.006 * vel); fRef.current = nf;
      const pos = puntoEn(R.pts, nf);
      if (prefsDe(db, u.id).territoriales) puntosHistoricos(db, 'validado').forEach(p => {
        if (!vistos.current.has(p.lugar) && Math.hypot(pos.x - p.x, pos.y - p.y) * 50 <= 450) { vistos.current.add(p.lugar); const av = Object.assign({ t: Date.now() }, p); setAvisos(a => [av].concat(a)); setActual(av); }
      });
      setF(nf);
      if (nf >= 1) { setActivo(false); setFin(true); act((d, t) => auditar(d, t, u.id, 'Finalizar trayecto', 'El recorrido no se guarda')); }
    }, 100);
    return () => clearInterval(iv);
  }, [activo, vel, ruta]);
  function iniciar() { fRef.current = 0; vistos.current = new Set(); setF(0); setAvisos([]); setActual(null); setFin(false); setActivo(true); act((d, t) => auditar(d, t, u.id, 'Iniciar trayecto', R.nombre)); }
  function terminar() { setActivo(false); setFin(true); act((d, t) => auditar(d, t, u.id, 'Finalizar trayecto', 'El recorrido no se guarda')); }
  const pos = puntoEn(R.pts, f);
  return html`
    ${!pr.territoriales ? html`<div className="aviso aviso-info"><strong>Activa los avisos territoriales</strong><span>Así te avisamos al acercarte a puntos con reportes históricos. Guardamos tu consentimiento con fecha y versión del texto, y puedes revocarlo cuando quieras.</span><button className="btn btn-p btn-s" style=${{ alignSelf: 'flex-start', marginTop: '6px' }} onClick=${() => { act((d, t) => setPreferencia(d, t, u.id, 'territoriales', true)); avisar('Avisos territoriales activados'); }}>Activar avisos territoriales</button></div>` : null}
    ${actual ? html`<div className="aviso aviso-warn" role="alert"><strong>Aviso territorial · ${fHora(actual.t)}</strong><span>Te acercas a <strong>${actual.lugar}</strong>: ${actual.n} reportes de ${TIPOS[actual.tipo].toLowerCase()} en los últimos 12 meses.</span><span className="small">Fuente: ${actual.fuente} · datos validados el ${fDia(actual.corte)}. No predice un delito: es contexto para decidir.</span><button className="link" onClick=${() => setActual(null)}>Entendido</button></div>` : null}
    <label className="campo"><span>Trayecto</span><select id="tr-ruta" className="inp" value=${ruta} disabled=${activo} onChange=${e => { setRuta(e.target.value); fRef.current = 0; setF(0); setFin(false); setAvisos([]); setActual(null); }}>${RUTAS_TRAYECTO.map(r => html`<option key=${r.id} value=${r.id}>${r.nombre} · ${r.desde} → ${r.hasta}</option>`)}</select></label>
    <${Mapa} capa=${[capaRuta(R.pts, f), capaPuntos(puntos), capaPosicion(pos)]} />
    <div className="entre small"><span>${activo ? html`<span className="b b-good">Trayecto activo</span>` : fin ? html`<span className="b">Finalizado</span>` : html`<span className="b">Detenido</span>`}</span><span className="quiet">Ubicación simulada · ${activo ? 'actualizada hace 0 s' : 'sin seguimiento'}</span></div>
    <div className="fila">${activo ? html`<button className="btn btn-d btn-block" onClick=${terminar}>Finalizar trayecto</button>` : html`<button className="btn btn-p btn-l btn-block" onClick=${iniciar}>${fin ? 'Repetir trayecto' : 'Iniciar trayecto'}</button>`}</div>
    <div className="campo"><span>Velocidad de la simulación</span><div className="chips">${[1, 2, 4].map(v => html`<button key=${v} className="chip" aria-pressed=${vel === v} onClick=${() => setVel(v)}>×${v}</button>`)}</div></div>
    ${fin ? html`<div className="aviso aviso-good"><strong>Trayecto finalizado</strong><span>No guardamos tu recorrido: sólo la hora de inicio y fin.</span></div>` : null}
    ${avisos.length ? html`<div className="card pila-s"><h3>Avisos de este trayecto</h3>${avisos.map((a, i) => html`<div key=${i} className="entre small"><span>${a.lugar}</span><span className="b b-warn">${a.n} · ${TIPOS[a.tipo]}</span></div>`)}</div>` : null}
    <p className="ayuda">Los círculos muestran hechos validados agrupados por punto (datos ficticios). Cada punto avisa una sola vez por trayecto. Ninguna ruta se declara segura.</p>`;
}

function FuentesHistoricas({ db, act, u, avisar }) {

      ${db.lotes.map(l => { const hs = db.hechos.filter(h => h.lote === l.id); const fu = db.fuentes.find(f => f.id === l.fuente); const lugares = new Set(hs.map(h => h.lugar)); return html`<div key=${l.id} className="card pila-s">

      setAnalizando(false); avisar('Análisis listo: candidatos ordenados por semejanza');
    }, 1100);
  }
  function marcar(x) {
    if (!marca || marca.id !== x.id || !marca.tipo) return avisar('Elige si coincide, no coincide o es indeterminado.');
    if ((marca.motivo || '').trim().length < 5) return avisar('La marca exige un motivo (al menos 5 caracteres).');
    act((d, t2) => { const bb = d.busquedas[k.id]; const c = bb.candidatos.find(z => z.id === x.id); c.marca = { tipo: marca.tipo, motivo: marca.motivo.trim(), u: u.id, t: t2 }; const cam = d.camaras.find(z => z.id === x.cam);
      if (marca.tipo === 'coincide') { bb.obs = [{ x: cam.x, y: cam.y, t: x.t, ref: `cám. ${cam.num}` }].concat(bb.obs || []); d.gestiones.push(gestion(k.id, u.id, t2, 'Observación por cámara', `Vehículo parecido en cám. ${cam.num} a las ${fHoraSeg(x.t)} (semejanza ${x.score.toFixed(2).replace('.', ',')}). No confirma identidad.`)); }
      auditar(d, t2, u.id, 'Marcar candidato visual', `Cám. ${cam.num} · ${marca.tipo}`); });
    setMarca(null); avisar(marca.tipo === 'coincide' ? 'Observación registrada como antecedente revisado' : 'Marca guardada');
  }
  const banda = s => s >= 0.75 ? ['alta', 'b-good'] : s >= 0.5 ? ['media', 'b-info'] : ['baja', ''];
  return html`
    <div className="titulo-pag"><div><h1>Búsqueda asistida</h1><p>La IA ordena qué revisar y una persona decide. Cada paso queda en la bitácora y la auditoría.</p></div></div>
    <div className="aviso aviso-warn"><strong>Ampliación propuesta (OE5 y OE6), no comprometida</strong><span>Las cámaras, el video y las detecciones son simulados. En el sistema real requeriría cámaras autorizadas con convenio y modelos evaluados.</span></div>
    <div className="filtros">
      <label className="campo" style=${{ flex: '1 1 260px' }}><span>Caso</span><select id="ba-caso" className="inp" value=${k.id} onChange=${e => { setCid(e.target.value); setConsulta(null); }}>${abiertos.map(c => html`<option key=${c.id} value=${c.id}>${c.folio} · ${vehTxt(veh(db, c.veh))}</option>`)}</select></label>
      <label className="campo"><span>Ventana de tiempo</span><select id="ba-ventana" className="inp" value=${ventana} onChange=${e => setVentana(Number(e.target.value))}><option value="5">5 min</option><option value="10">10 min</option><option value="20">20 min</option></select></label>
      <button className="btn btn-p" onClick=${() => { act((d, t2) => generarBusqueda(d, t2, u, k, ventana)); setConsulta(null); avisar('Corredores e hipótesis generados'); }}>${b.version ? `Actualizar corredores (v${b.version + 1})` : 'Generar corredores'}</button>
    </div>
    <div className="col2">
      <div className="card pila-s">
        <div className="card-cab" style=${{ marginBottom: 0 }}><h3>Mapa de la búsqueda</h3><span className="small quiet">${vehTxt(v)} · ${v.patente}</span></div>
        <${Mapa} capa=${[capaCamaras(camsOrg, b.recs), b.corredores ? capaCorredores(b.corredores) : null, capaObs(b.obs), capaAncla(b.ancla || anclaDe(db, k))]} />
        <div className="ley"><span><i style=${{ background: 'var(--signal)' }}></i>Ancla</span><span><i style=${{ background: 'var(--accent)' }}></i>Cámara recomendada</span><span><i style=${{ background: 'var(--good)' }}></i>Observación por cámara</span></div>
        ${b.version ? html`<p className="small">Hipótesis v${b.version} · ancla: <span className="mono">${b.ancla.ref}</span> a las ${fHora(b.ancla.t)} · ventana ${b.ventana} min · 20–35 km/h. Los corredores son posibilidades, no posiciones confirmadas.</p>` : html`<p className="small quiet">Genera corredores desde el último antecedente aceptado (${anclaDe(db, k).ref}).</p>`}
      </div>
      <div className="card pila-s"><h3>Cámaras recomendadas</h3>
        ${!b.recs ? html`<p className="small quiet">Aparecen al generar los corredores.</p>` : !b.recs.length ? html`<p className="small quiet">Ninguna cámara de la organización cubre los corredores.</p>` : b.recs.map((r, i) => { const c = db.camaras.find(z => z.id === r.cam); return html`<div key=${r.cam} className="ev">
          <span className="ev-n">Cám. ${c.num} · ${c.nombre}</span>${r.disponible ? html`<span className=${'b ' + (r.prioridad === 'alta' ? 'b-warn' : r.prioridad === 'media' ? 'b-info' : '')}>Prioridad ${r.prioridad}</span>` : html`<span className="b">En mantención</span>`}
          <small>${r.motivo} · intervalo ${fHora(r.desde)}–${fHora(r.hasta)}</small>
          ${r.decision ? html`<small><strong>${{ aceptado: 'Aceptada', descartado: 'Descartada', indeterminado: 'Indeterminada' }[r.decision.tipo]}</strong> por ${usuario(db, r.decision.u).nombre}: ${r.decision.motivo}</small>` : null}
          ${r.disponible && !r.decision ? html`<div style=${{ gridColumn: '1 / -1' }} className="pila-s">
            <div className="chips">${[['aceptado', 'Aceptar'], ['descartado', 'Descartar'], ['indeterminado', 'Indeterminado']].map(([tk, lb]) => html`<button key=${tk} className="chip" aria-pressed=${!!(dec && dec.cam === r.cam && dec.tipo === tk)} onClick=${() => setDec({ cam: r.cam, tipo: tk, motivo: dec && dec.cam === r.cam ? dec.motivo : '' })}>${lb}</button>`)}</div>
            ${dec && dec.cam === r.cam ? html`<div className="fila"><input id=${'ba-mot-' + r.cam} className="inp" style=${{ flex: '1 1 180px' }} placeholder="Motivo (obligatorio)" value=${dec.motivo} onChange=${e => setDec(Object.assign({}, dec, { motivo: e.target.value }))} /><button className="btn btn-s btn-p" onClick=${() => decidir(r)}>Guardar</button></div>` : null}
          </div>` : null}
          ${r.decision && r.decision.tipo === 'aceptado' ? html`<div style=${{ gridColumn: '1 / -1' }}><button className="btn btn-s" onClick=${() => consultar(r, i)}>Consultar video (simulado)</button></div>` : null}
        </div>`; })}
        <p className="ayuda">La prioridad explica qué revisar primero; no es la probabilidad de encontrar el vehículo.</p>
      </div>
    </div>
    ${cons ? html`<div className="card pila">
      <div className="card-cab" style=${{ marginBottom: 0 }}><h3>Video · Cám. ${camCons.num}</h3><span className="small quiet">Consulta registrada: caso, cámara, operador e intervalo</span></div>
      <div className="col2" style=${{ alignItems: 'start' }}>
        <${VideoSimulado} key=${cons.id} cam=${camCons} consulta=${cons} vehs=${vehs} inicio=${vehs[2] ? vehs[2].t - 4.5 : 0} />
        <div className="pila-s">
          <button className="btn btn-p" onClick=${analizar} disabled=${analizando}>${analizando ? 'Analizando el video…' : 'Analizar con IA'}</button>
          <p className="ayuda">Modelo de detección de demostración (v0.3, simulado). Compara color y tipo con el vehículo del caso: ${v.color}, ${tipoDe(v)}.</p>
          ${cands.map(x => { const [bl, bc] = banda(x.score); return html`<div key=${x.id} className="ev">
            <span className="fila" style=${{ flexWrap: 'nowrap' }}><svg width="64" height="30" viewBox="-70 -32 140 46" aria-hidden="true"><${Auto} x=${0} y=${0} color=${x.color} /></svg><span className="ev-n">${x.color} · ${x.tipo}</span></span>
            <span className=${'b ' + bc}>${x.score.toFixed(2).replace('.', ',')} · ${bl}</span>
            <small>Pasa a las ${fHoraSeg(x.t)} · ${x.marca ? html`<strong>${{ coincide: 'Coincide', no_coincide: 'No coincide', indeterminado: 'Indeterminado' }[x.marca.tipo]}</strong> · ${x.marca.motivo}` : 'sin revisar'}</small>
            ${!x.marca ? html`<div style=${{ gridColumn: '1 / -1' }} className="pila-s"><div className="chips">${[['coincide', 'Coincide'], ['no_coincide', 'No coincide'], ['indeterminado', 'Indeterminado']].map(([tk, lb]) => html`<button key=${tk} className="chip" aria-pressed=${!!(marca && marca.id === x.id && marca.tipo === tk)} onClick=${() => setMarca({ id: x.id, tipo: tk, motivo: marca && marca.id === x.id ? marca.motivo : '' })}>${lb}</button>`)}</div>
              ${marca && marca.id === x.id ? html`<div className="fila"><input id=${'ba-mc-' + x.id} className="inp" style=${{ flex: '1 1 160px' }} placeholder="Motivo (obligatorio)" value=${marca.motivo} onChange=${e => setMarca(Object.assign({}, marca, { motivo: e.target.value }))} /><button className="btn btn-s btn-p" onClick=${() => marcar(x)}>Guardar</button></div>` : null}</div>` : null}
          </div>`; })}
          ${cands.length ? html`<p className="ayuda">La semejanza no acredita identidad: una persona revisa cada candidato.</p>` : null}
        </div>
      </div>
    </div>` : null}
    <${Copiloto} db=${db} act=${act} u=${u} k=${k} />`;
}

/* ---------------- Guía de la demo y estructura general ---------------- */
const PASOS_GUIA = [
  { u: 'u1', t: 'Ana reporta el robo', x: 'Ve a Reportar y completa los tres pasos. Prueba «Simular corte de red»: el reintento devuelve el mismo folio.' },
  { u: 'u4', t: 'El supervisor asigna el caso', x: 'Abre el caso de Ana en la bandeja, asígnalo a Carla y pásalo a En revisión.' },
  { u: 'u3', t: 'La operadora pide ayuda', x: 'En el detalle del caso, prepara y publica una solicitud de colaboración con datos mínimos.' },
  { u: 'u2', t: 'Pedro informa un avistamiento', x: 'En Ayudar, toca «Lo vi», marca el punto en el mapa y envía el aporte.' },
  { u: 'u3', t: 'La operadora decide con motivo', x: 'En Avistamientos, acepta el aporte con un motivo y escribe un resumen para Ana.' },
  { u: 'u3', t: 'Búsqueda asistida con cámaras e IA', x: 'En Búsqueda asistida genera corredores, acepta una cámara con motivo, consulta el video simulado, analízalo con IA y pregunta al copiloto.' },
  { u: 'u1', t: 'Ana sigue su caso', x: 'Revisa Avisos y Mi caso. Comparte el seguimiento con pedro.soto@demo.invalid.' },
  { u: 'u1', t: 'Ana usa un trayecto con avisos', x: 'En Inicio abre «Trayecto con avisos», activa los avisos territoriales e inicia el recorrido simulado.' },
  { u: 'u5', t: 'La administradora valida fuentes y audita', x: 'En Fuentes históricas valida el lote pendiente; en Auditoría verás cada acción, incluidos los accesos denegados.' },
];

function Guia({ db, cerrar, entrar, reiniciar, uid }) {
  const [confirmar, setConfirmar] = useState(false);
  useEffect(() => { const k = e => { if (e.key === 'Escape') cerrar(); }; window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, []);
  return html`<div className="guia-fondo" onClick=${cerrar}></div>
    <aside className="guia" role="dialog" aria-modal="true" aria-label="Guía de la demo">
      <div className="entre"><h2 style=${{ fontSize: '26px' }}>Guía de la demo</h2><button className="btn btn-s" onClick=${cerrar}>Cerrar</button></div>
      <p className="quiet">Recorre un caso completo cambiando de cuenta. Los datos se comparten entre cuentas y se guardan sólo en este navegador.</p>
      <ol>${PASOS_GUIA.map((p, i) => html`<li key=${i}><strong>${p.t}</strong><span className="small quiet">${p.x}</span><span>${uid === p.u ? html`<span className="b b-info">Sesión actual</span>` : html`<button className="btn btn-s" onClick=${() => entrar(p.u)}>Entrar como ${usuario(db, p.u).nombre}</button>`}</span></li>`)}</ol>
      <div className="aviso aviso-neutro small"><strong>Qué no hace este prototipo</strong><span>No envía correos ni notificaciones reales, no usa mapas reales ni se conecta a la API. En el sistema real, cada regla que ves aquí la valida la API FastAPI y la base PostgreSQL con PostGIS.</span></div>
      ${confirmar ? html`<div className="fila"><span className="small">¿Borrar todo lo que hiciste y volver a los datos iniciales?</span><button className="btn btn-d btn-s" onClick=${reiniciar}>Sí, reiniciar</button><button className="btn btn-s" onClick=${() => setConfirmar(false)}>Cancelar</button></div>`
        : html`<button className="btn btn-d" onClick=${() => setConfirmar(true)}>Reiniciar datos de la demo</button>`}
    </aside>`;
}

function BarraPrototipo({ db, u, salir, abrirGuia }) {
  const mem = u ? membresiaActiva(db, u.id) : null;
  const org = mem ? db.organizaciones.find(o => o.id === mem.org) : null;
  return html`<header className="pbar">
    <div className="marca"><${Logo} /><span>RutaAlerta</span></div>
    <span className="pchip" title="Datos ficticios. No se conecta a sistemas reales.">Prototipo navegable</span>
    <span className="sp"></span>
    ${u ? html`<div className="who"><strong>${u.nombre}</strong><span>${ROLES[u.rol]}${org ? ' · ' + org.nombre : ''}</span></div>` : null}
    <button className="btn btn-s" onClick=${abrirGuia}>Guía de la demo</button>
    ${u ? html`<button className="btn btn-s" onClick=${salir}>Cerrar sesión</button>` : null}
  </header>`;
}

function App() {
  const store = useRef(null);
  if (!store.current) store.current = cargar();
  const [, setV] = useState(0);
  const act = useCallback(fn => { const r = fn(store.current, Date.now()); guardar(store.current); setV(v => v + 1); return r; }, []);
  const [uid, setUid] = useState(() => { try { const s = localStorage.getItem(CLAVE_SESION); return s && store.current.usuarios.some(x => x.id === s) ? s : null; } catch (e) { return null; } });
  const [guia, setGuia] = useState(false);
  const [toast, setToast] = useState(null);
  const tRef = useRef(null);
  const avisar = useCallback(m => { setToast(m); clearTimeout(tRef.current); tRef.current = setTimeout(() => setToast(null), 3600); }, []);
  const entrar = useCallback(id => { setUid(id); try { localStorage.setItem(CLAVE_SESION, id); } catch (e) { } setGuia(false); window.scrollTo(0, 0); }, []);
  const salir = useCallback(() => { setUid(null); try { localStorage.removeItem(CLAVE_SESION); } catch (e) { } window.scrollTo(0, 0); }, []);
  const reiniciar = () => { store.current = semilla(); guardar(store.current); setGuia(false); salir(); setV(v => v + 1); avisar('Datos de la demo reiniciados'); };
  const db = store.current;
  const u = uid ? db.usuarios.find(x => x.id === uid) : null;
  return html`
    <${BarraPrototipo} db=${db} u=${u} salir=${salir} abrirGuia=${() => setGuia(true)} />
    ${!u ? html`<${Ingreso} db=${db} act=${act} entrar=${entrar} />`
      : u.rol === 'ciudadano' ? html`<${AppCiudadana} key=${u.id} db=${db} act=${act} u=${u} avisar=${avisar} salir=${salir} />`
      : html`<${Panel} key=${u.id} db=${db} act=${act} u=${u} avisar=${avisar} />`}
    ${guia ? html`<${Guia} db=${db} cerrar=${() => setGuia(false)} entrar=${entrar} reiniciar=${reiniciar} uid=${uid} />` : null}
    ${toast ? html`<div className="toast" role="status">${toast}</div>` : null}`;
}

ReactDOM.createRoot(document.getElementById('app')).render(html`<${App} />`);
})();
</script>

</body>
