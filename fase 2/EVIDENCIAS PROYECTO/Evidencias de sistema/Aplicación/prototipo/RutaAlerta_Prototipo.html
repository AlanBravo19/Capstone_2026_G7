const PADRE = { resultado: 'micaso', aporte: 'ayudar', vehiculos: 'inicio', antecedentes: 'inicio', avisos: 'inicio', trayecto: 'inicio' };

function AppCiudadana({ db, act, u, avisar, salir }) {
  const [pant, setPant] = useState('inicio');
  const [param, setParam] = useState(null);
  const [reloj, setReloj] = useState(Date.now());
  const mainRef = useRef(null);
  useEffect(() => { const i = setInterval(() => setReloj(Date.now()), 30000); return () => clearInterval(i); }, []);
  const ir = (p, x) => { setPant(p); setParam(x || null); if (mainRef.current) mainRef.current.scrollTop = 0; if (window.innerWidth <= 860) window.scrollTo(0, 0); };
  const noLeidos = db.notifs.filter(n => n.u === u.id && !n.leido).length;
  const props = { db, act, u, ir, param, avisar, salir };
  const pantallas = { inicio: Inicio, reportar: Reportar, resultado: Resultado, micaso: MiCaso, ayudar: Ayudar, aporte: InformarAporte, vehiculos: Vehiculos, antecedentes: Antecedentes, perfil: Perfil, avisos: Avisos, trayecto: Trayecto };
  const P = pantallas[pant];
  const nota = NOTAS[pant];
  const tabActiva = TABS.some(x => x[0] === pant) ? pant : PADRE[pant];
  return html`<div className="ciudadano">
    <div className="telefono">
      <div className="t-estado" aria-hidden="true"><span className="num">${fHora(reloj)}</span><span>RutaAlerta</span></div>
      <header className="t-cab">
        ${PADRE[pant] ? html`<button className="t-volver" aria-label="Volver" onClick=${() => ir(PADRE[pant])}><${Icono} n="volver" /></button>` : null}
        <h2>${TITULOS[pant]}</h2>
      </header>
      <div className="t-main" ref=${mainRef}><${P} key=${pant + JSON.stringify(param)} ...${props} /></div>
      <nav className="t-tabs" aria-label="Secciones de la app">
        ${TABS.map(([k, l, ic]) => html`<button key=${k} className="t-tab" aria-current=${tabActiva === k ? 'page' : undefined} onClick=${() => ir(k)}><${Icono} n=${ic} t=${22} />${l}${k === 'inicio' && noLeidos > 0 ? html`<span className="punto-rojo">${noLeidos}</span>` : null}</button>`)}
      </nav>
    </div>
    <aside className="notas" aria-label="Qué estás viendo">
      <span className="eyebrow">Qué estás viendo · ${nota.hu}</span>
      <h3>${nota.t}</h3>
      <ul>${nota.p.map((x, i) => html`<li key=${i}>${x}</li>`)}</ul>
      <p className="prueba"><strong>Prueba esto: </strong>${nota.prueba}</p>
      <p className="small quiet">Estás como <strong>${u.nombre}</strong> (${u.correo}). Usa «Guía de la demo» para cambiar de cuenta y ver el otro lado.</p>
    </aside>
  </div>`;
}

function Inicio({ db, act, u, ir }) {
  const t = Date.now();
  const mis = db.casos.filter(c => c.u === u.id).sort((a, b) => b.creado - a.creado);
  const activo = mis.find(c => c.estado !== 'cerrado');
  const noLeidos = db.notifs.filter(n => n.u === u.id && !n.leido).length;
  const vigentes = db.solicitudes.filter(s => vigenteSol(s, t) && caso(db, s.caso).estado !== 'cerrado').length;
  const borrador = db.borradores[u.id];
  const misVeh = db.vinculos.filter(l => l.u === u.id).length;
  return html`
    ${u.estado === 'pendiente' ? html`<div className="aviso aviso-info"><strong>Confirma tu correo</strong><span>Te enviamos un enlace de verificación. En la demo puedes confirmarlo aquí.</span><button className="link" onClick=${() => act((d, t2) => { const x = d.usuarios.find(z => z.id === u.id); x.estado = 'activo'; auditar(d, t2, u.id, 'Verificar correo', normCorreo(u.correo)); })}>Marcar correo como verificado</button></div>` : null}
    <div className="saludo"><span className="eyebrow">${new Date(t).toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long' })}</span><h3>Hola, ${u.nombre.split(' ')[0]}</h3></div>
    ${noLeidos > 0 ? html`<button className="aviso aviso-info" style=${{ textAlign: 'left', cursor: 'pointer' }} onClick=${() => ir('avisos')}><strong>Tienes ${noLeidos} ${noLeidos === 1 ? 'aviso nuevo' : 'avisos nuevos'}</strong><span>Toca para verlos.</span></button>` : null}
    ${borrador ? html`<div className="aviso aviso-warn"><strong>${borrador.pendiente ? 'Envío pendiente de confirmación' : 'Borrador guardado en este teléfono'}</strong><span>${borrador.pendiente ? 'No recibimos respuesta del servidor. Reintenta el envío: no se duplicará.' : 'Todavía no se envía. Nadie lo está revisando.'}</span><button className="link" onClick=${() => ir('reportar')}>Continuar</button></div>` : null}
    ${activo ? html`<div className="card pila-s">
        <div className="entre"><span className="eyebrow">Caso activo</span><${Insignia} tipo="estado" valor=${activo.estado} /></div>
        <span className="folio">${activo.folio}</span>
        <span className="small quiet">${vehTxt(veh(db, activo.veh))} · reportado ${hace(activo.creado, t)}</span>
        <button className="btn btn-block" onClick=${() => ir('micaso', { caso: activo.id })}>Ver mi caso</button>
      </div>` : null}
    <button className="btn btn-p btn-l btn-block" onClick=${() => ir('reportar')}><${Icono} n="reportar" />Reportar un robo o intento</button>
    <div className="accesos">
      <button className="acc" onClick=${() => ir('ayudar')}><${Icono} n="ayudar" /><strong>Ayuda a encontrar</strong><span>${vigentes} ${vigentes === 1 ? 'solicitud vigente' : 'solicitudes vigentes'}</span></button>
      <button className="acc" onClick=${() => ir('vehiculos')}><${Icono} n="auto" /><strong>Mis vehículos</strong><span>${misVeh} ${misVeh === 1 ? 'vehículo' : 'vehículos'}</span></button>
      <button className="acc" onClick=${() => ir('trayecto')}><${Icono} n="escudo" /><strong>Trayecto con avisos</strong><span>Te avisa cerca de puntos con historial</span></button>
      <button className="acc" onClick=${() => ir('antecedentes')}><${Icono} n="mapa" /><strong>Antecedentes</strong><span>Por sector, con fuente y fecha</span></button>
      <button className="acc" onClick=${() => ir('micaso')}><${Icono} n="caso" /><strong>Mi caso</strong><span>Estado, novedades y contacto</span></button>
      <button className="acc" onClick=${() => ir('perfil')}><${Icono} n="campana" /><strong>Avisos y privacidad</strong><span>Tú decides qué recibir</span></button>
    </div>
    <p className="aviso aviso-neutro small"><strong>Ante una emergencia, llama al 133.</strong><span>RutaAlerta no reemplaza la denuncia ni la atención de emergencia.</span></p>`;
}

function Reportar({ db, act, u, ir, avisar }) {
  const ahora = Date.now();
  const borr = db.borradores[u.id];
  const mios = db.vinculos.filter(l => l.u === u.id).map(l => ({ l, v: veh(db, l.veh) }));
  const usables = mios.filter(x => x.l.estado === 'autorizado' || x.l.estado === 'pendiente');
  const [paso, setPaso] = useState(borr && borr.pendiente ? 3 : 1);
  const [f, setF] = useState(() => borr ? borr.datos : { tipo: '', veh: usables[0] ? usables[0].v.id : '', cuando: aLocal(ahora), x: null, y: null, precision: 30, relato: '', clave: uuid() });
  const [corte, setCorte] = useState(false);
  const [sinRespuesta, setSinRespuesta] = useState(!!(borr && borr.pendiente));
  const [err, setErr] = useState('');
  const set = (k, v) => setF(p => Object.assign({}, p, { [k]: v }));
  const sector = f.x != null ? sectorDe(f.x, f.y) : null;

  function validar(n) {
    if (n === 1) {
      if (!f.tipo) return 'Elige qué pasó. Si no sabes, elige «Sin clasificar».';
      if (!usables.some(x => x.v.id === f.veh)) return 'Elige un vehículo vinculado a tu cuenta. Puedes registrarlo en «Mis vehículos».';
      if (!f.cuando) return 'Indica cuándo ocurrió.';
      if (deLocal(f.cuando) > Date.now() + MIN) return 'La fecha del hecho no puede ser futura.';
    }
    if (n === 2 && (f.x == null || !sector)) return 'Toca el mapa para marcar dónde ocurrió.';
    if (n === 3 && f.relato.trim().length < 5) return 'Cuenta brevemente qué pasó (al menos 5 caracteres).';
    return '';
  }
  function siguiente() { const e = validar(paso); setErr(e); if (!e) setPaso(paso + 1); }
  function guardarBorrador() { act(d => { d.borradores[u.id] = { datos: f, pendiente: false, t: Date.now() }; }); avisar('Borrador guardado en este teléfono. Aún no se envía.'); ir('inicio'); }
  function enviar() {
    for (const n of [1, 2, 3]) { const e = validar(n); if (e) { setErr(e); setPaso(n); return; } }
    setErr('');
    const r = act((d, t) => crearCaso(d, t, u, f));
    if (corte) { act(d => { d.borradores[u.id] = { datos: f, pendiente: true, t: Date.now() }; }); setSinRespuesta(true); setCorte(false); return; }
    act(d => { delete d.borradores[u.id]; });
    ir('resultado', { caso: r.caso.id, reintento: r.reintento });
  }

  if (!usables.length) return html`<div className="card pila"><h3>Primero registra tu vehículo</h3><p className="quiet">Para reportar necesitas un vehículo vinculado a tu cuenta, aunque el vínculo esté pendiente de revisión.</p><button className="btn btn-p" onClick=${() => ir('vehiculos')}>Ir a Mis vehículos</button></div>`;

  if (sinRespuesta) return html`<div className="pila">
    <div className="aviso aviso-warn"><strong>No recibimos respuesta del servidor</strong><span>Tu reporte puede haber llegado o no. Reintentar es seguro: usa la misma clave de envío y nunca crea un segundo caso.</span></div>
    <div className="card pila-s"><span className="eyebrow">Clave de envío</span><span className="mono small">${f.clave}</span><span className="ayuda">La app la genera una sola vez por reporte.</span></div>
    <button className="btn btn-p btn-l btn-block" onClick=${() => { const r = act((d, t) => crearCaso(d, t, u, f)); act(d => { delete d.borradores[u.id]; }); ir('resultado', { caso: r.caso.id, reintento: r.reintento }); }}>Reintentar envío</button>
  </div>`;

  return html`<div className="pila">
    <div className="pasos-cab" aria-hidden="true">${[1, 2, 3].map(n => html`<div key=${n} className=${n <= paso ? 'on' : ''}></div>`)}</div>
    <span className="eyebrow">Paso ${paso} de 3 · ${['Qué pasó', 'Dónde', 'Relato y envío'][paso - 1]}</span>
    ${paso === 1 ? html`
      <div className="aviso aviso-warn"><strong>Hazlo desde un lugar seguro.</strong><span>Si vas conduciendo, detente antes de usar la app.</span></div>
      <div className="campo"><span>¿Qué pasó?</span><div className="chips">${Object.keys(TIPOS).map(k => html`<button key=${k} type="button" className="chip" aria-pressed=${f.tipo === k} onClick=${() => set('tipo', k)}>${TIPOS[k]}</button>`)}</div></div>
      <label className="campo"><span>Vehículo</span><select id="rep-veh" className="inp" value=${f.veh} onChange=${e => set('veh', e.target.value)}>
        ${mios.map(x => html`<option key=${x.v.id} value=${x.v.id} disabled=${!(x.l.estado === 'autorizado' || x.l.estado === 'pendiente')}>${vehTxt(x.v)} · ${x.v.patente}${x.l.estado === 'pendiente' ? ' (vínculo pendiente)' : ''}</option>`)}
      </select></label>
      <label className="campo"><span>¿Cuándo ocurrió?</span><input id="rep-cuando" className="inp" type="datetime-local" max=${aLocal(ahora)} value=${f.cuando} onChange=${e => set('cuando', e.target.value)} /></label>` : null}
    ${paso === 2 ? html`
      <p className="small quiet">Toca el mapa donde ocurrió. Luego ajusta la precisión.</p>
      <${Mapa} punto=${f.x != null ? { x: f.x, y: f.y } : null} precision=${f.precision} onPick=${(x, y) => setF(p => Object.assign({}, p, { x, y }))} />
      <div className="entre small"><span>${sector ? html`Sector: <strong>${nombreSector(sector)}</strong>` : 'Sin ubicación marcada'}</span><span className="quiet">Mapa esquemático, no a escala</span></div>
      <label className="campo"><span>Precisión: ±${f.precision} m</span><input id="rep-precision" className="rango" type="range" min="10" max="300" step="10" value=${f.precision} onChange=${e => set('precision', Number(e.target.value))} /></label>` : null}
    ${paso === 3 ? html`
      <label className="campo"><span>Relato (privado)</span><textarea id="rep-relato" className="inp" placeholder="Qué pasó, cuántas personas, hacia dónde fueron…" value=${f.relato} onChange=${e => set('relato', e.target.value)}></textarea><span className="ayuda">Sólo lo ve la institución. Nunca se publica.</span></label>
      <div className="card pila-s small">
        <div className="entre"><span className="quiet">Qué pasó</span><strong>${TIPOS[f.tipo] || '—'}</strong></div>
        <div className="entre"><span className="quiet">Vehículo</span><strong>${vehTxt(veh(db, f.veh))}</strong></div>
        <div className="entre"><span className="quiet">Cuándo</span><strong>${f.cuando ? fFecha(deLocal(f.cuando)) : '—'}</strong></div>
        <div className="entre"><span className="quiet">Dónde</span><strong>${nombreSector(sector)} · ±${f.precision} m</strong></div>
      </div>
      <label className="check"><input id="rep-corte" type="checkbox" checked=${corte} onChange=${e => setCorte(e.target.checked)} /><span><strong>Simular corte de red</strong><br /><span className="ayuda">El reporte llega al servidor, pero la respuesta se pierde. Sirve para probar el reintento sin duplicados.</span></span></label>` : null}
    ${err ? html`<p className="error" role="alert">${err}</p>` : null}
    <div className="pila-s">
      ${paso < 3 ? html`<button className="btn btn-p btn-l btn-block" onClick=${siguiente}>Continuar</button>` : html`<button className="btn btn-p btn-l btn-block" onClick=${enviar}>Enviar reporte</button>`}
      <div className="fila">${paso > 1 ? html`<button className="btn" onClick=${() => { setErr(''); setPaso(paso - 1); }}>Atrás</button>` : null}<button className="btn" onClick=${guardarBorrador}>Guardar borrador</button></div>
    </div>
  </div>`;
}

function Resultado({ db, act, u, ir, param, avisar }) {
  const k = caso(db, param && param.caso);
  const [ref, setRef] = useState(k ? k.refDenuncia : '');
  if (!k) return html`<p>No encontramos el reporte.</p>`;
  const evs = db.evidencias.filter(e => e.caso === k.id && !e.aporte);
  function adjuntar(a) { act((d, t) => { d.evidencias.push(Object.assign({ id: 'e' + hexAzar(4), caso: k.id, aporte: null, u: u.id, estado: 'recibido', t }, a)); auditar(d, t, u.id, 'Adjuntar evidencia', `${a.nombre} · caso ${k.folio}`); }); avisar('Archivo recibido con su huella'); }
  function declarar() {
    if (ref.trim().length < 3) return avisar('Escribe el número o referencia de la denuncia.');
    act((d, t) => { const c = caso(d, k.id); c.denuncia = 'declarada'; c.refDenuncia = ref.trim(); auditar(d, t, u.id, 'Declarar denuncia', `Caso ${c.folio}`); });
    avisar('Referencia de denuncia guardada');
  }
  return html`
    ${param.reintento ? html`<div className="aviso aviso-info"><strong>Reintento recibido</strong><span>El servidor ya tenía este reporte y devolvió el mismo folio. No se creó un caso nuevo.</span></div>` : null}
    <div className="aviso aviso-good"><strong>Recibido por el servidor</strong><span className="folio">${k.folio}</span><span>Estado: ${ESTADOS[k.estado]} · recibido el ${fFecha(k.creado)}</span></div>
    <div className="aviso aviso-neutro"><span>Recibido no significa que una institución ya lo esté atendiendo. Te avisaremos cada novedad comunicable.</span></div>
    <div className="card pila-s"><div className="entre"><h3>Evidencia</h3><span className="small quiet">Opcional · privada</span></div>
      ${evs.length ? evs.map(e => html`<${FilaEvidencia} key=${e.id} e=${e} />`) : html`<p className="small quiet">Aún no adjuntas archivos.</p>`}
      <${Subir} onArchivo=${adjuntar} />
    </div>
    <div className="card pila-s"><h3>Denuncia oficial</h3>
      ${k.denuncia === 'no_informada' ? html`<p className="small quiet">Este reporte no reemplaza la denuncia. Si ya la hiciste, guarda su número aquí.</p>
        <div className="fila"><input id="res-ref" className="inp" style=${{ flex: '1 1 160px' }} placeholder="N.º o referencia" value=${ref} onChange=${e => setRef(e.target.value)} /><button className="btn" onClick=${declarar}>Guardar</button></div>` : html`<p className="small">Referencia: <strong>${k.refDenuncia}</strong> · <${Insignia} tipo="denuncia" valor=${k.denuncia} /></p>`}
    </div>
    <button className="btn btn-p btn-block" onClick=${() => ir('micaso', { caso: k.id })}>Ver mi caso</button>`;
}

function siguientePaso(k) {
  if (k.estado === 'cerrado') return `El caso se cerró con motivo «${MOTIVOS[k.cierre.motivo]}».`;
  if (k.denuncia === 'no_informada') return 'Si aún no la haces, realiza la denuncia y guarda su número en tu caso.';
  if (k.estado === 'reportado') return 'Tu caso espera la primera revisión de la organización receptora.';
  if (k.estado === 'en_revision') return 'Un operador revisa los antecedentes. No necesitas hacer nada más por ahora.';
  return 'Tu caso está en gestión. Te avisaremos cada novedad comunicable.';
}

function Seguimiento({ db, k, limitado }) {
  const t = Date.now();
  const nov = db.gestiones.filter(g => g.caso === k.id && g.visible === 'afectado').map(g => ({ t: g.t, txt: g.desc, de: g.accion }))
    .concat(db.aportes.filter(a => a.caso === k.id && a.estado !== 'pendiente' && a.resumen).map(a => ({ t: a.revisiones.length ? a.revisiones[a.revisiones.length - 1].t : a.rec, txt: a.resumen, de: 'Aporte ciudadano revisado' })))
    .sort((a, b) => b.t - a.t);
  const ult = db.aportes.filter(a => a.caso === k.id && a.estado === 'aceptado').sort((a, b) => b.obs - a.obs)[0];
  const idx = ORDEN.indexOf(k.estado);
  const recursos = db.recursos.filter(r => recursoVigente(r, t));
  return html`
    <div className="card pila-s">
      <div className="entre"><span className="folio">${k.folio}</span><${Insignia} tipo="estado" valor=${k.estado} /></div>
      <span className="small quiet">${vehTxt(veh(db, k.veh))} · ${veh(db, k.veh).patente} · reportado el ${fFecha(k.creado)}</span>
    </div>
    <div className="card"><h3 style=${{ marginBottom: '12px' }}>Estado del caso</h3>
      <ol className="linea-t">${ORDEN.map((e, i) => html`<li key=${e} className=${i < idx ? 'hecho' : i === idx ? 'actual' : ''}><i></i><span>${i === idx ? html`<strong>${ESTADOS[e]}</strong>` : ESTADOS[e]}</span></li>`)}</ol>
    </div>
    <div className="aviso aviso-info"><strong>Siguiente paso</strong><span>${siguientePaso(k)}</span></div>
    <div className="card pila-s"><h3>Novedades</h3>
      ${nov.length ? nov.map((n, i) => html`<div key=${i} className="pila-s" style=${{ gap: '2px', paddingBottom: '8px', borderBottom: i < nov.length - 1 ? '1px solid var(--line)' : '0' }}><span className="small quiet">${fFecha(n.t)} · ${n.de}</span><span>${n.txt}</span></div>`) : html`<p className="small quiet">Sin novedades comunicables por ahora. No inventamos avances: te avisaremos cuando ocurra algo.</p>`}
    </div>
    <div className="card pila-s"><h3>Último antecedente revisado</h3>
      ${ult ? html`<p className="small">Sector aproximado: <strong>${nombreSector(sectorDe(ult.x, ult.y))}</strong> · observado el ${fFecha(ult.obs)}</p>
        <${Mapa} sector=${sectorDe(ult.x, ult.y)} />
        <p className="ayuda">La coordenada exacta queda en el ámbito institucional. Un aporte revisado no es una recuperación.</p>` : html`<p className="small quiet">Aún no hay aportes aceptados para este caso.</p>`}
    </div>
    ${limitado ? null : html`<div className="card pila-s"><h3>Apoyo verificado</h3>
      ${recursos.map(r => html`<div key=${r.id} className="entre small"><span><strong>${r.nombre}</strong><br /><span className="quiet">${r.territorio} · canal ficticio de demostración</span></span><span className="b b-good">Revisado ${fDia(r.revisado)}</span></div>`)}
      <p className="ayuda">Sólo mostramos canales revisados en los últimos 180 días.</p></div>`}`;
}

function MiCaso({ db, act, u, ir, param, avisar }) {
  const t = Date.now();
  const mis = db.casos.filter(c => c.u === u.id).sort((a, b) => b.creado - a.creado);
  const acomp = db.contactos.filter(c => c.u === u.id && !c.revocado && c.vence > t);
  const [sel, setSel] = useState(param && param.caso ? param.caso : (mis[0] ? mis[0].id : null));
  const k = mis.find(c => c.id === sel) || mis[0];
  const [ref, setRef] = useState('');
  return html`
    ${!mis.length ? html`<div className="card pila"><h3>No tienes casos reportados</h3><p className="quiet small">Si sufriste un robo o un intento, repórtalo desde un lugar seguro.</p><button className="btn btn-p" onClick=${() => ir('reportar')}>Reportar</button></div>` : null}
    ${mis.length > 1 ? html`<label className="campo"><span>Caso</span><select id="mc-caso" className="inp" value=${k.id} onChange=${e => setSel(e.target.value)}>${mis.map(c => html`<option key=${c.id} value=${c.id}>${c.folio} · ${ESTADOS[c.estado]}</option>`)}</select></label>` : null}
    ${k ? html`<${Seguimiento} db=${db} k=${k} />` : null}
    ${k && k.denuncia === 'no_informada' ? html`<div className="card pila-s"><h3>Denuncia oficial</h3><p className="small quiet">Guarda aquí el número de tu denuncia.</p><div className="fila"><input id="mc-ref" className="inp" style=${{ flex: '1 1 160px' }} placeholder="N.º o referencia" value=${ref} onChange=${e => setRef(e.target.value)} /><button className="btn" onClick=${() => { if (ref.trim().length < 3) return avisar('Escribe la referencia de la denuncia.'); act((d, t2) => { const c = caso(d, k.id); c.denuncia = 'declarada'; c.refDenuncia = ref.trim(); auditar(d, t2, u.id, 'Declarar denuncia', `Caso ${c.folio}`); }); avisar('Referencia guardada'); }}>Guardar</button></div></div>` : null}
    ${k ? html`<${Contactos} db=${db} act=${act} u=${u} k=${k} avisar=${avisar} />` : null}
    ${acomp.length ? html`<div className="pila"><span className="eyebrow">Casos que acompañas como contacto de confianza</span>
      ${acomp.map(c => { const kc = caso(db, c.caso); return html`<div key=${c.id} className="pila"><p className="small quiet">Acceso otorgado por ${usuario(db, c.otorga).nombre} · vence el ${fDia(c.vence)}</p><${Seguimiento} db=${db} k=${kc} limitado=${true} /></div>`; })}</div>` : null}`;
}

function Contactos({ db, act, u, k, avisar }) {
  const t = Date.now();
  const lista = db.contactos.filter(c => c.caso === k.id).sort((a, b) => b.t - a.t);
  const [correo, setCorreo] = useState('');
  const [alcance, setAlcance] = useState('seguimiento');
  const [vence, setVence] = useState(aFechaLocal(t + 30 * DIA));
  const [err, setErr] = useState('');
  const [quitando, setQuitando] = useState(null);
  function dar(e) {
    e.preventDefault(); setErr('');
    const dest = db.usuarios.find(x => normCorreo(x.correo) === normCorreo(correo));
    if (!dest) return setErr('No encontramos una cuenta con ese correo. La persona necesita una cuenta en RutaAlerta.');
    if (dest.id === u.id) return setErr('No puedes darte acceso a tu propia cuenta.');
    const fin = new Date(vence + 'T23:59').getTime();
    if (!vence || fin <= Date.now()) return setErr('El vencimiento debe ser una fecha futura.');
    if (lista.some(c => c.u === dest.id && !c.revocado && c.vence > Date.now())) return setErr('Esa persona ya tiene acceso vigente.');
    act((d, t2) => { d.contactos.push({ id: 'k' + hexAzar(4), caso: k.id, otorga: u.id, u: dest.id, alcance, t: t2, vence: fin, revocado: null }); auditar(d, t2, u.id, 'Conceder acceso de confianza', `${dest.nombre} · caso ${k.folio}`); });
    setCorreo(''); avisar(`Acceso concedido a ${dest.nombre}`);
  }
  function quitar(c) { act((d, t2) => { const x = d.contactos.find(z => z.id === c.id); x.revocado = t2; auditar(d, t2, u.id, 'Revocar acceso de confianza', `${usuario(d, c.u).nombre} · caso ${k.folio}`); }); setQuitando(null); avisar('Acceso quitado. La próxima consulta de esa persona será rechazada.'); }
  return html`<div className="card pila"><div><h3>Contacto de confianza</h3><p className="small quiet">Comparte el seguimiento con alguien que te acompañe. No verá tu relato ni la ubicación exacta.</p></div>
    ${lista.map(c => { const activo = !c.revocado && c.vence > t; return html`<div key=${c.id} className="ev"><span className="ev-n">${usuario(db, c.u).nombre}</span>${activo ? html`<span className="b b-good">Vigente</span>` : html`<span className="b">${c.revocado ? 'Revocado' : 'Vencido'}</span>`}
      <small>${c.alcance === 'seguimiento' ? 'Ve estado y novedades' : 'Ve estado, novedades y recibe avisos'} · ${activo ? 'vence el ' + fDia(c.vence) : c.revocado ? 'quitado el ' + fDia(c.revocado) : 'venció el ' + fDia(c.vence)}</small>
      ${activo ? html`<div style=${{ gridColumn: '1 / -1' }}>${quitando === c.id ? html`<div className="fila"><span className="small">¿Quitar el acceso ahora?</span><button className="btn btn-s btn-d" onClick=${() => quitar(c)}>Sí, quitar</button><button className="btn btn-s" onClick=${() => setQuitando(null)}>Cancelar</button></div>` : html`<button className="btn btn-s btn-d" onClick=${() => setQuitando(c.id)}>Quitar acceso</button>`}</div>` : null}</div>`; })}
    <form className="pila-s" onSubmit=${dar}>
      <label className="campo"><span>Correo de la persona</span><input id="ct-correo" className="inp" type="email" placeholder="persona@correo.cl" value=${correo} onChange=${e => setCorreo(e.target.value)} /><span className="ayuda">En la demo puedes usar pedro.soto@demo.invalid.</span></label>
      <div className="campo"><span>Qué puede ver</span><div className="chips"><button type="button" className="chip" aria-pressed=${alcance === 'seguimiento'} onClick=${() => setAlcance('seguimiento')}>Seguimiento</button><button type="button" className="chip" aria-pressed=${alcance === 'seguimiento_y_avisos'} onClick=${() => setAlcance('seguimiento_y_avisos')}>Seguimiento y avisos</button></div></div>
      <label className="campo"><span>Vence el (obligatorio)</span><input id="ct-vence" className="inp" type="date" min=${aFechaLocal(t + DIA)} value=${vence} onChange=${e => setVence(e.target.value)} /></label>
      ${err ? html`<p className="error" role="alert">${err}</p>` : null}
      <button className="btn btn-p" type="submit">Dar acceso</button>
    </form>
  </div>`;
}

function Ayudar({ db, u, ir }) {
  const t = Date.now();
  const sols = db.solicitudes.filter(s => vigenteSol(s, t) && caso(db, s.caso).estado !== 'cerrado').sort((a, b) => a.vence - b.vence);
  const mios = db.aportes.filter(a => a.u === u.id).sort((a, b) => b.rec - a.rec);
  return html`
    <div className="aviso aviso-warn"><strong>Si ves el vehículo, no lo sigas ni intervengas.</strong><span>Sólo informa lo que viste. Tu seguridad es primero.</span></div>
    <span className="eyebrow">${sols.length} ${sols.length === 1 ? 'solicitud vigente' : 'solicitudes vigentes'}</span>
    ${sols.map(s => { const k = caso(db, s.caso); const v = veh(db, k.veh); return html`<div key=${s.id} className="card pila-s">
      <div className="sol"><div className="foto-ph"><${Icono} n="auto" t=${26} /></div><div><strong>${v.marca} ${v.modelo} ${v.color}</strong><p className="small">Patente <span className="mono">${v.patente}</span></p><p className="small quiet">Sector: ${nombreSector(s.zona)}</p></div></div>
      <p className="small">${s.texto}</p>
      <div className="entre"><span className="small quiet">${quedan(s.vence, t)}${k.u === u.id ? ' · es tu caso' : ''}</span><button className="btn btn-p btn-s" onClick=${() => ir('aporte', { sol: s.id })}>Lo vi</button></div>
    </div>`; })}
    ${!sols.length ? html`<p className="aviso aviso-neutro small">No hay solicitudes vigentes. Las vencidas o retiradas dejan de mostrarse y no aceptan aportes.</p>` : null}
    ${mios.length ? html`<div className="card pila-s"><h3>Mis aportes</h3>${mios.map(a => html`<div key=${a.id} className="entre small"><span>Aporte #${a.num} · ${fFecha(a.rec)}</span><${Insignia} tipo="aporte" valor=${a.estado} /></div>`)}</div>` : null}
    <p className="ayuda">Sólo se muestran solicitudes aprobadas, con datos mínimos. Nunca la dirección, el relato ni coordenadas exactas.</p>`;
}

function InformarAporte({ db, act, u, ir, param, avisar }) {
  const ahora = Date.now();
  const s = db.solicitudes.find(x => x.id === (param && param.sol));
  const [f, setF] = useState({ cuando: aLocal(ahora), x: null, y: null, precision: 40, desc: '', clave: uuid() });
  const [foto, setFoto] = useState(null);
  const [err, setErr] = useState('');
  const [hecho, setHecho] = useState(null);
  if (!s) return html`<p>No encontramos la solicitud.</p>`;
  const k = caso(db, s.caso); const v = veh(db, k.veh);
  if (!vigenteSol(s, ahora) || k.estado === 'cerrado') return html`<div className="aviso aviso-neutro"><strong>Esta solicitud ya no está vigente</strong><span>Venció o fue retirada, así que no acepta nuevos aportes.</span><button className="link" onClick=${() => ir('ayudar')}>Ver solicitudes vigentes</button></div>`;
  const set = (a, b) => setF(p => Object.assign({}, p, { [a]: b }));
  function enviar() {
    setErr('');
    if (!f.cuando || deLocal(f.cuando) > Date.now() + MIN) return setErr('La hora no puede ser futura.');
    if (f.x == null || !sectorDe(f.x, f.y)) return setErr('Toca el mapa para marcar dónde lo viste.');
    if (f.desc.trim().length < 5) return setErr('Describe brevemente lo que viste (al menos 5 caracteres).');
    const r = act((d, t) => {
      const previo = d.aportes.find(a => a.u === u.id && a.clave === f.clave);
      if (previo) return previo;
      const id = 'a' + hexAzar(4);
      const num = d.aportes.reduce((m, a) => Math.max(m, a.num), 0) + 1;
      let fotoId = null;
      if (foto) { fotoId = 'e' + hexAzar(4); d.evidencias.push(Object.assign({ id: fotoId, caso: k.id, aporte: id, u: u.id, estado: 'recibido', t }, foto)); }
      const a = { id, num, caso: k.id, sol: s.id, u: u.id, obs: deLocal(f.cuando), rec: t, x: f.x, y: f.y, precision: Number(f.precision), desc: f.desc.trim(), foto: fotoId, clave: f.clave, estado: 'pendiente', revisiones: [], resumen: '' };
      d.aportes.push(a); auditar(d, t, u.id, 'Informar avistamiento', `Aporte #${num}`);
      return a;
    });
    setHecho(r); avisar('Aporte recibido');
  }
  if (hecho) return html`<div className="aviso aviso-good"><strong>Recibido. Un operador lo revisará.</strong><span>Aporte #${hecho.num} · ${fFecha(hecho.rec)}</span><span>Aportar no confirma una recuperación. Gracias por ayudar sin intervenir.</span></div>
    <button className="btn btn-block" onClick=${() => ir('ayudar')}>Volver a las solicitudes</button>`;
  return html`
    <div className="aviso aviso-neutro"><strong>${vehTxt(v)} · <span className="mono">${v.patente}</span></strong><span>Solicitud vigente hasta el ${fFecha(s.vence)}</span></div>
    <label className="campo"><span>¿Cuándo lo viste?</span><input id="ap-cuando" className="inp" type="datetime-local" max=${aLocal(ahora)} value=${f.cuando} onChange=${e => set('cuando', e.target.value)} /></label>
    <div className="campo"><span>¿Dónde?</span><${Mapa} punto=${f.x != null ? { x: f.x, y: f.y } : null} precision=${f.precision} onPick=${(x, y) => setF(p => Object.assign({}, p, { x, y }))} /></div>
    <label className="campo"><span>Precisión: ±${f.precision} m</span><input id="ap-precision" className="rango" type="range" min="10" max="300" step="10" value=${f.precision} onChange=${e => set('precision', Number(e.target.value))} /></label>
    <label className="campo"><span>¿Qué viste?</span><textarea id="ap-desc" className="inp" placeholder="Por ejemplo: estacionado frente a un local, sin personas dentro." value=${f.desc} onChange=${e => set('desc', e.target.value)}></textarea></label>
    ${foto ? html`<div className="ev"><span className="ev-n">${foto.nombre}</span><span className="b b-good">Lista</span><small>huella <span className="mono">${foto.sha.slice(0, 12)}…</span> · <button className="link" onClick=${() => setFoto(null)}>Quitar</button></small></div>` : html`<${Subir} etiqueta="Agregar foto (opcional)" onArchivo=${a => setFoto(a)} />`}
    ${err ? html`<p className="error" role="alert">${err}</p>` : null}
    <button className="btn btn-p btn-l btn-block" onClick=${enviar}>Enviar aporte</button>`;
}

function Vehiculos({ db, act, u, avisar }) {
  const mios = db.vinculos.filter(l => l.u === u.id).map(l => ({ l, v: veh(db, l.veh) }));
  const [abierto, setAbierto] = useState(false);
  const [f, setF] = useState({ marca: 'Toyota', modelo: 'Yaris', color: '', patente: '', tipo: 'Propietaria/o' });
  const [err, setErr] = useState('');
  const set = (a, b) => setF(p => Object.assign({}, p, { [a]: b }, a === 'marca' ? { modelo: MARCAS[b][0] } : {}));
  function registrar(e) {
    e.preventDefault(); setErr('');
    const p = normPatente(f.patente);
    if (p.length < 5 || p.length > 8) return setErr('La patente debe tener entre 5 y 8 letras o números.');
    if (f.color.trim().length < 3) return setErr('Indica el color del vehículo.');
    const existe = db.vehiculos.find(v => v.patente === p);
    if (existe && mios.some(x => x.v.id === existe.id)) return setErr('Ya tienes un vínculo con ese vehículo.');
    act((d, t) => {
      let vid = existe ? existe.id : 'v' + hexAzar(4);
      if (!existe) d.vehiculos.push({ id: vid, marca: f.marca, modelo: f.modelo, color: f.color.trim().toLowerCase(), patente: p });
      d.vinculos.push({ id: 'l' + hexAzar(4), u: u.id, veh: vid, tipo: f.tipo, estado: 'pendiente', inicio: t });
      auditar(d, t, u.id, 'Solicitar vínculo vehicular', `Patente ${p}`);
    });
    setAbierto(false); setF({ marca: 'Toyota', modelo: 'Yaris', color: '', patente: '', tipo: 'Propietaria/o' });
    avisar(existe ? 'Ese vehículo ya existía: creamos tu solicitud de vínculo, pendiente de revisión.' : 'Vehículo registrado. El vínculo queda pendiente de revisión.');
  }
  return html`
    ${mios.map(({ l, v }) => html`<div key=${l.id} className="card pila-s"><div className="entre"><strong>${v.marca} ${v.modelo} · ${v.color}</strong><${Insignia} tipo="vinculo" valor=${l.estado} /></div><span className="small quiet">Patente <span className="mono">${v.patente}</span> · ${l.tipo}</span></div>`)}
    ${abierto ? html`<form className="card pila" onSubmit=${registrar}>
      <h3>Registrar vehículo</h3>
      <div className="col2b"><label className="campo"><span>Marca</span><select id="vh-marca" className="inp" value=${f.marca} onChange=${e => set('marca', e.target.value)}>${Object.keys(MARCAS).map(m => html`<option key=${m}>${m}</option>`)}</select></label>
      <label className="campo"><span>Modelo</span><select id="vh-modelo" className="inp" value=${f.modelo} onChange=${e => set('modelo', e.target.value)}>${MARCAS[f.marca].map(m => html`<option key=${m}>${m}</option>`)}</select></label></div>
      <div className="col2b"><label className="campo"><span>Patente</span><input id="vh-patente" className="inp mono" placeholder="AB·CD·12" value=${f.patente} onChange=${e => set('patente', e.target.value)} /><span className="ayuda">Se guarda como ${normPatente(f.patente) || '—'}</span></label>
      <label className="campo"><span>Color</span><input id="vh-color" className="inp" placeholder="gris" value=${f.color} onChange=${e => set('color', e.target.value)} /></label></div>
      <label className="campo"><span>Tu relación con el vehículo</span><select id="vh-tipo" className="inp" value=${f.tipo} onChange=${e => set('tipo', e.target.value)}><option>Propietaria/o</option><option>Conductor/a autorizado/a</option></select></label>
      ${err ? html`<p className="error" role="alert">${err}</p>` : null}
      <div className="fila"><button className="btn btn-p" type="submit">Registrar</button><button type="button" className="btn" onClick=${() => setAbierto(false)}>Cancelar</button></div>
    </form>` : html`<button className="btn btn-p btn-block" onClick=${() => setAbierto(true)}>Registrar vehículo</button>`}
    <p className="aviso aviso-neutro small">Conocer una patente no da acceso a los datos del titular. Cada vínculo lo revisa una persona antes de autorizarse.</p>`;
}

function Antecedentes({ db, ir }) {
  const t = Date.now();
  const desde = t - 365 * DIA;
  const base = db.casos.filter(c => c.creado >= desde && !(c.cierre && c.cierre.motivo === 'duplicado'));
  const validos = new Set(db.lotes.filter(l => l.estado === 'validado').map(l => l.id));
  const hechosVal = db.hechos.filter(h => validos.has(h.lote) && h.fecha >= desde);
  const calor = {}; SECTORES.forEach(s => { calor[s.id] = base.filter(c => c.zona === s.id).length + hechosVal.filter(h => sectorDe(h.x, h.y) === s.id).length; });
  const rutas = [
    { n: 'Ruta 1 · por Hualpén', min: 22, km: '9,4', sec: ['centro', 'hualpen', 'sanpedro'] },
    { n: 'Ruta 2 · por el puente directo', min: 18, km: '7,1', sec: ['centro', 'sanpedro'] },
  ];
  const faltan = s => s.sec.filter(x => calor[x] < 2);
  return html`
    <${Mapa} calor=${calor} />
    <div className="ley"><span><i style=${{ background: 'var(--accent)', opacity: .42 }}></i>Más reportes</span><span><i style=${{ background: 'var(--accent)', opacity: .2 }}></i>Menos reportes</span><span><i style=${{ background: 'var(--warn-soft)', border: '1px dashed var(--warn)' }}></i>Información insuficiente</span></div>
    <p className="small quiet">Casos reportados y hechos validados de fuentes históricas (ficticias) de los últimos 12 meses, agrupados por sector · corte ${fFecha(t)}</p>
    <div className="aviso aviso-warn"><strong>Información insuficiente no significa que la zona sea segura.</strong><span>Con menos de 2 registros no mostramos una tendencia.</span></div>
    <div className="card pila-s"><h3>Comparar rutas</h3><p className="small quiet">Desde Concepción Centro hasta San Pedro de la Paz (tiempos y distancias de ejemplo).</p>
      ${rutas.map((r, i) => { const fl = faltan(r); return html`<div key=${i} className="ev"><span className="ev-n">${r.n}</span><span className="small num">${r.min} min · ${r.km} km</span><small>${fl.length ? `Exposición relativa: no se califica. Falta información en ${fl.map(nombreSector).join(' y ')}.` : `Exposición relativa: ${r.sec.reduce((m, x) => m + calor[x], 0)} reportes en sus sectores.`}</small></div>`; })}
      <p className="ayuda">Es una comparación, no una garantía. Ninguna ruta se declara segura.</p>
    </div>
    <button className="btn btn-p btn-block" onClick=${() => ir('trayecto')}>Iniciar un trayecto con avisos</button>`;
}

function Perfil({ db, act, u, avisar, salir }) {
  const pr = prefsDe(db, u.id);
  const cons = db.consent[u.id] || {};
  const filas = [['avisos_caso', 'Avisos de mi caso', 'Novedades comunicables de tus casos.'], ['territoriales', 'Avisos territoriales', 'Hechos validados cerca de tus trayectos.'], ['push', 'Notificaciones push', 'En la pantalla del teléfono, con contenido mínimo.'], ['correo', 'Correo electrónico', 'Un resumen a tu correo.']];
  function cambiar(k) { act((d, t) => { const p = prefsDe(d, u.id); p[k] = !p[k]; d.prefs[u.id] = p; d.consent[u.id] = Object.assign({}, d.consent[u.id], { [k]: { activo: p[k], version: '1.0', t } }); auditar(d, t, u.id, p[k] ? 'Otorgar consentimiento' : 'Revocar consentimiento', `${k} · versión 1.0`); }); avisar('Preferencia guardada'); }
  return html`
    <div className="card pila-s"><strong>${u.nombre}</strong><span className="small quiet">${u.correo} · cuenta ${u.estado === 'pendiente' ? 'pendiente de verificación' : 'activa'} · rol ciudadano</span></div>
    <div className="card pila"><h3>Avisos</h3>
      ${filas.map(([k, l, d]) => html`<div key=${k} className="entre" style=${{ flexWrap: 'nowrap' }}><span><strong>${l}</strong><br /><span className="ayuda">${d}${cons[k] ? ` · ${cons[k].activo ? 'aceptado' : 'revocado'} el ${fFecha(cons[k].t)} (texto v${cons[k].version})` : ''}</span></span><button className="interruptor" role="switch" aria-checked=${pr[k]} aria-label=${l} onClick=${() => cambiar(k)}></button></div>`)}
      <p className="ayuda">Por defecto sólo avisamos de tus casos. Las notificaciones no muestran la dirección exacta ni el relato.</p>
    </div>
    <button className="btn btn-block" onClick=${salir}>Cerrar sesión</button>`;
}

function Avisos({ db, act, u, ir }) {
  const lista = db.notifs.filter(n => n.u === u.id);
  useEffect(() => { if (lista.some(n => !n.leido)) act(d => d.notifs.forEach(n => { if (n.u === u.id) n.leido = true; })); }, []);
  return html`${lista.length ? lista.map(n => html`<button key=${n.id} className="card pila-s" style=${{ textAlign: 'left', cursor: 'pointer' }} onClick=${() => ir('micaso', { caso: n.caso })}><span className="small quiet">${fFecha(n.t)}${n.leido ? '' : ' · nuevo'}</span><span>${n.texto}</span></button>`) : html`<p className="aviso aviso-neutro">No tienes avisos. Te avisaremos cuando haya una novedad comunicable.</p>`}`;
}

/* ---------------- Panel institucional ---------------- */
function Panel({ db, act, u, avisar }) {
  const esAdmin = u.rol === 'administrador';
  const mem = membresiaActiva(db, u.id);
  const org = mem ? db.organizaciones.find(o => o.id === mem.org) : null;
  const items = esAdmin ? [['admin', 'Administración'], ['indicadores', 'Indicadores']] : [['bandeja', 'Bandeja'], ['avistamientos', 'Avistamientos'], ['solicitudes', 'Solicitudes'], ['busqueda', 'Búsqueda asistida'], ['indicadores', 'Indicadores']];
  const [vista, setVista] = useState(items[0][0]);
  const [casoSel, setCasoSel] = useState(null);
  const [aporteSel, setAporteSel] = useState(null);
  const [busqSel, setBusqSel] = useState(null);
  if (!esAdmin && !mem) return html`<main className="denegado"><span className="codigo">403</span><h1>Tu cuenta no tiene una membresía activa</h1><p className="quiet">Tu participación en la organización terminó o fue suspendida. Para operar casos, una administradora debe conceder una nueva membresía.</p></main>`;
  const pendientes = org ? db.aportes.filter(a => a.estado === 'pendiente' && caso(db, a.caso).org === org.id).length : 0;
  function abrirCaso(id) {
    const k = caso(db, id);
    if (!org || k.org !== org.id) { act((d, t) => auditar(d, t, u.id, 'Consultar caso', 'Caso de otra organización', 'denegado')); setVista('denegado'); return; }
    setCasoSel(id); setVista('caso'); window.scrollTo(0, 0);
  }
  function irAporte(id) { setAporteSel(id); setVista('avistamientos'); window.scrollTo(0, 0); }
  const actual = vista === 'caso' || vista === 'denegado' ? 'bandeja' : vista;
  return html`<div className="panel">
    <nav className="lado" aria-label="Secciones del panel">
      <div className="lado-org"><span className="eyebrow">${esAdmin ? 'Administración' : 'Organización'}</span><strong>${esAdmin ? 'Todas las organizaciones' : org.nombre}</strong><span className="small quiet">${esAdmin ? 'Sin acceso a expedientes privados' : org.cobertura}</span></div>
      ${items.map(([k, l]) => html`<button key=${k} className="lado-item" aria-current=${actual === k ? 'page' : undefined} onClick=${() => { setVista(k); if (k === 'busqueda') setBusqSel(null); window.scrollTo(0, 0); }}>${l}${k === 'avistamientos' && pendientes > 0 ? html`<span className="cuenta">${pendientes}</span>` : null}${k === 'busqueda' ? html`<span className="cuenta" style=${{ background: 'var(--accent-soft)', color: 'var(--accent)', fontSize: '10px' }}>OE5</span>` : null}</button>`)}
      <div className="lado-pie">Rol: ${ROLES[u.rol]}<br />Entorno: prueba</div>
    </nav>
    <main className="trabajo">
      ${vista === 'bandeja' ? html`<${Bandeja} db=${db} u=${u} org=${org} abrirCaso=${abrirCaso} />` : null}
      ${vista === 'caso' ? html`<${DetalleCaso} key=${casoSel} db=${db} act=${act} u=${u} org=${org} id=${casoSel} volver=${() => setVista('bandeja')} irAporte=${irAporte} irBusqueda=${id => { setBusqSel(id); setVista('busqueda'); window.scrollTo(0, 0); }} avisar=${avisar} />` : null}
      ${vista === 'busqueda' ? html`<${BusquedaAsistida} key=${busqSel || 'b'} db=${db} act=${act} u=${u} org=${org} inicial=${busqSel} avisar=${avisar} />` : null}
      ${vista === 'denegado' ? html`<div className="denegado card"><span className="codigo">403</span><h1>Caso fuera del ámbito autorizado</h1><p className="quiet">Ese caso pertenece a otra organización. Respondemos igual si no existe, para no revelar qué casos hay. El intento quedó registrado en la auditoría.</p><button className="btn" onClick=${() => setVista('bandeja')}>Volver a la bandeja</button></div>` : null}
      ${vista === 'avistamientos' ? html`<${Avistamientos} db=${db} act=${act} u=${u} org=${org} sel=${aporteSel} setSel=${setAporteSel} abrirCaso=${abrirCaso} avisar=${avisar} />` : null}
      ${vista === 'solicitudes' ? html`<${Solicitudes} db=${db} act=${act} u=${u} org=${org} abrirCaso=${abrirCaso} avisar=${avisar} />` : null}
      ${vista === 'indicadores' ? html`<${Indicadores} db=${db} org=${esAdmin ? null : org} />` : null}
      ${vista === 'admin' ? html`<${Admin} db=${db} act=${act} u=${u} avisar=${avisar} />` : null}
    </main>
  </div>`;
}

function Bandeja({ db, u, org, abrirCaso }) {
  const t = Date.now();
  const [fe, setFe] = useState('abiertos');
  const [fp, setFp] = useState('todas');
  const [sin, setSin] = useState(false);
  const [q, setQ] = useState('');
  const propios = db.casos.filter(c => c.org === org.id);
  let lista = propios.filter(c => fe === 'abiertos' ? c.estado !== 'cerrado' : fe === 'todos' ? true : c.estado === fe);
  if (fp !== 'todas') lista = lista.filter(c => c.prioridad === fp);
  if (sin) lista = lista.filter(c => !c.asignado);
  if (q.trim()) { const n = normPatente(q); lista = lista.filter(c => normPatente(c.folio).includes(n) || veh(db, c.veh).patente.includes(n)); }
  lista.sort((a, b) => a.creado - b.creado);
  const abiertos = propios.filter(c => c.estado !== 'cerrado');
  const pendAp = db.aportes.filter(a => a.estado === 'pendiente' && propios.some(c => c.id === a.caso)).length;
  const otro = db.casos.find(c => c.org !== org.id);
  return html`
    <div className="titulo-pag"><div><h1>Bandeja de casos</h1><p>Sólo casos de ${org.nombre}, del más antiguo al más reciente. La urgencia y la verificación van en columnas distintas.</p></div></div>
    <div className="resumen">
      <div className="cifra"><strong>${abiertos.length}</strong><span>Casos abiertos</span></div>
      <div className=${'cifra' + (abiertos.filter(c => !c.asignado).length ? ' alerta' : '')}><strong>${abiertos.filter(c => !c.asignado).length}</strong><span>Sin responsable</span></div>
      <div className=${'cifra' + (pendAp ? ' alerta' : '')}><strong>${pendAp}</strong><span>Aportes por revisar</span></div>
      <div className="cifra"><strong>${abiertos.filter(c => c.prioridad === 'alta').length}</strong><span>Prioridad alta</span></div>
    </div>
    <div className="filtros">
      <label className="campo"><span>Estado</span><select id="bd-estado" className="inp" value=${fe} onChange=${e => setFe(e.target.value)}><option value="abiertos">Abiertos</option><option value="todos">Todos</option>${ORDEN.map(e => html`<option key=${e} value=${e}>${ESTADOS[e]}</option>`)}</select></label>
      <label className="campo"><span>Prioridad</span><select id="bd-prioridad" className="inp" value=${fp} onChange=${e => setFp(e.target.value)}><option value="todas">Todas</option>${Object.keys(PRIORIDADES).map(p => html`<option key=${p} value=${p}>${PRIORIDADES[p]}</option>`)}</select></label>
      <label className="campo"><span>Buscar</span><input id="bd-buscar" className="inp" placeholder="Folio o patente" value=${q} onChange=${e => setQ(e.target.value)} /></label>
      <label className="check" style=${{ alignSelf: 'center', marginTop: '18px' }}><input id="bd-sin" type="checkbox" checked=${sin} onChange=${e => setSin(e.target.checked)} />Sin responsable</label>
    </div>
    <div className="tabla-wrap"><table>
      <thead><tr><th>Folio</th><th>Estado</th><th>Prioridad</th><th>Denuncia</th><th>Sector</th><th>Antigüedad</th><th>Aportes</th><th>Responsable</th></tr></thead>
      <tbody>${lista.map(c => { const pa = db.aportes.filter(a => a.caso === c.id && a.estado === 'pendiente').length; return html`<tr key=${c.id} className="fila-clic" onClick=${() => abrirCaso(c.id)}>
        <td><button className="link mono" onClick=${e => { e.stopPropagation(); abrirCaso(c.id); }}>${c.folio}</button></td>
        <td><${Insignia} tipo="estado" valor=${c.estado} /></td>
        <td><${Insignia} tipo="prioridad" valor=${c.prioridad} /></td>
        <td>${DENUNCIA[c.denuncia]}</td>
        <td>${nombreSector(c.zona)}</td>
        <td className="num">${hace(c.creado, t).replace('hace ', '')}</td>
        <td className="num">${pa ? html`<span className="b b-warn">${pa} por revisar</span>` : '0'}</td>
        <td>${c.asignado ? usuario(db, c.asignado).nombre : html`<span className="b b-warn">Sin responsable</span>`}</td>
      </tr>`; })}</tbody>
    </table>${!lista.length ? html`<p style=${{ padding: '18px' }} className="quiet">No hay casos con esos filtros.</p>` : null}</div>
    ${otro ? html`<div className="aviso aviso-neutro"><strong>Prueba de aislamiento entre organizaciones (CP44)</strong><span>Intenta abrir un caso que pertenece a otra organización. Debe responder 403 y quedar en la auditoría.</span><button className="link" onClick=${() => abrirCaso(otro.id)}>Intentar abrir ${otro.folio}</button></div>` : null}`;
}

function DetalleCaso({ db, act, u, org, id, volver, irAporte, irBusqueda, avisar }) {
  const t = Date.now();
  const k = caso(db, id);
  const v = veh(db, k.veh);
  const rep = usuario(db, k.u);
  const esSup = u.rol === 'supervisor';
  const miembros = db.membresias.filter(m => m.org === org.id && m.estado === 'activa').map(m => usuario(db, m.u));
  const gest = db.gestiones.filter(g => g.caso === k.id).sort((a, b) => b.t - a.t);
  const aps = db.aportes.filter(a => a.caso === k.id).sort((a, b) => b.rec - a.rec);
  const sols = db.solicitudes.filter(s => s.caso === k.id).sort((a, b) => b.inicio - a.inicio);
  const solVig = sols.find(s => vigenteSol(s, t));
  const evs = db.evidencias.filter(e => e.caso === k.id);
  const cerrado = k.estado === 'cerrado';
  const sig = ORDEN[ORDEN.indexOf(k.estado) + 1];
  const [nuevoResp, setNuevoResp] = useState(k.asignado || '');
  const [g, setG] = useState({ accion: ACCIONES_GESTION[0], desc: '', visible: false });
  const [errG, setErrG] = useState('');
  const [solF, setSolF] = useState(null);
  const [retiro, setRetiro] = useState(null);
  const [cierre, setCierre] = useState({ motivo: '', recuperado: aLocal(t), evid: '' });
  const [errC, setErrC] = useState([]);
  const [confirmarCierre, setConfirmarCierre] = useState(false);

  function avanzar() {
    if (!sig || sig === 'cerrado') return;
    act((d, t2) => {
      const c = caso(d, k.id); const ant = c.estado; c.estado = sig;
      if (ant === 'reportado' && !d.gestiones.some(x => x.caso === c.id && x.accion === 'Primera revisión')) d.gestiones.push(gestion(c.id, u.id, t2, 'Primera revisión', 'Se revisan los antecedentes del reporte.'));
      d.gestiones.push(gestion(c.id, u.id, t2 + 1, 'Cambio de estado', `El caso pasó a ${ESTADOS[sig]}.`, 'afectado'));
      notificar(d, t2, c, `Tu caso ${c.folio} pasó a ${ESTADOS[sig]}.`);
      auditar(d, t2, u.id, 'Cambiar estado', `Caso ${c.folio}: ${ESTADOS[ant]} → ${ESTADOS[sig]}`);
    });
    avisar(`Caso en ${ESTADOS[sig]}`);
  }
  function prioridad(p) { act((d, t2) => { const c = caso(d, k.id); c.prioridad = p; d.gestiones.push(gestion(c.id, u.id, t2, 'Cambio de prioridad', `Prioridad ${PRIORIDADES[p].toLowerCase()}.`)); auditar(d, t2, u.id, 'Cambiar prioridad', `Caso ${c.folio}: ${PRIORIDADES[p]}`); }); avisar('Prioridad actualizada'); }
  function asignar() {
    if (!nuevoResp || nuevoResp === k.asignado) return;
    const m = membresiaActiva(db, nuevoResp);
    if (!m || m.org !== org.id) return avisar('Sólo puedes asignar a miembros activos de tu organización.');
    act((d, t2) => { const c = caso(d, k.id); c.asignado = nuevoResp; d.gestiones.push(gestion(c.id, u.id, t2, 'Asignación', `Responsable: ${usuario(d, nuevoResp).nombre}. La asignación anterior se cerró.`)); auditar(d, t2, u.id, 'Asignar caso', `Caso ${c.folio} → ${usuario(d, nuevoResp).nombre}`); });
    avisar(`Caso asignado a ${usuario(db, nuevoResp).nombre}`);
  }
  function verificarDenuncia() { act((d, t2) => { const c = caso(d, k.id); c.denuncia = 'verificada'; d.gestiones.push(gestion(c.id, u.id, t2, 'Denuncia verificada', `Referencia confirmada: ${c.refDenuncia}.`)); auditar(d, t2, u.id, 'Verificar denuncia', `Caso ${c.folio}`); }); avisar('Denuncia marcada como verificada'); }
  function agregarGestion(e) {
    e.preventDefault(); setErrG('');
    if (g.desc.trim().length < 5) return setErrG('Describe la gestión (al menos 5 caracteres).');
    act((d, t2) => { const c = caso(d, k.id); d.gestiones.push(gestion(c.id, u.id, t2, g.accion, g.desc.trim(), g.visible ? 'afectado' : 'interna')); if (g.visible) notificar(d, t2, c, `Novedad en tu caso ${c.folio}: ${g.desc.trim()}`); auditar(d, t2, u.id, 'Registrar gestión', `Caso ${c.folio}: ${g.accion}`); });
    setG({ accion: ACCIONES_GESTION[0], desc: '', visible: false }); avisar('Gestión agregada a la bitácora');
  }
  function publicar(e) {
    e.preventDefault();
    if (!solF.texto.trim() || !solF.motivo.trim()) return setSolF(Object.assign({}, solF, { err: 'Completa el texto aprobado y el motivo de la autorización.' }));
    const fin = deLocal(solF.vence);
    if (!fin || fin <= Date.now()) return setSolF(Object.assign({}, solF, { err: 'El vencimiento debe ser posterior a ahora.' }));
    act((d, t2) => { const c = caso(d, k.id); d.solicitudes.push({ id: 's' + hexAzar(4), caso: c.id, zona: solF.zona, texto: solF.texto.trim(), motivo: solF.motivo.trim(), u: u.id, inicio: t2, vence: fin, estado: 'publicada', retiro: null }); d.gestiones.push(gestion(c.id, u.id, t2, 'Solicitud de colaboración publicada', `Zona publicable: ${nombreSector(solF.zona)} · vence el ${fFecha(fin)}`)); notificar(d, t2, c, `Se publicó una solicitud de colaboración para tu caso ${c.folio}.`); auditar(d, t2, u.id, 'Publicar solicitud', `Caso ${c.folio}`); });
    setSolF(null); avisar('Solicitud publicada en el catálogo ciudadano');
  }
  function retirar() {
    if (!retiro || retiro.motivo.trim().length < 5) return setRetiro(Object.assign({}, retiro, { err: 'El retiro exige un motivo (al menos 5 caracteres).' }));
    act((d, t2) => { const s = d.solicitudes.find(x => x.id === retiro.id); s.estado = 'retirada'; s.retiro = { t: t2, motivo: retiro.motivo.trim() }; d.gestiones.push(gestion(k.id, u.id, t2, 'Solicitud retirada', retiro.motivo.trim())); auditar(d, t2, u.id, 'Retirar solicitud', `Caso ${k.folio}`); });
    setRetiro(null); avisar('Solicitud retirada. Ya no acepta aportes.');
  }
  function adjuntar(a) { act((d, t2) => { d.evidencias.push(Object.assign({ id: 'e' + hexAzar(4), caso: k.id, aporte: null, u: u.id, estado: 'recibido', t: t2 }, a)); auditar(d, t2, u.id, 'Adjuntar evidencia', `${a.nombre} · caso ${k.folio}`); }); avisar('Respaldo recibido con su huella'); }
  function validarCierre() {
    const e = [];
    if (!cierre.motivo) e.push('Elige el motivo de cierre.');
    if (cierre.motivo === 'recuperado') {
      const r = deLocal(cierre.recuperado);
      if (!r) e.push('Indica la fecha de recuperación.');
      else { if (r < k.hecho) e.push('La recuperación no puede ser anterior al hecho.'); if (r > Date.now() + MIN) e.push('La recuperación no puede ser futura.'); }
      if (!cierre.evid) e.push('Cerrar como recuperado exige una evidencia recibida de este mismo caso.');
    }
    return e;
  }
  function cerrar() {
    const e = validarCierre(); setErrC(e); if (e.length) { setConfirmarCierre(false); return; }
    act((d, t2) => {
      const c = caso(d, k.id); c.estado = 'cerrado';
      c.cierre = { motivo: cierre.motivo, t: t2, recuperado: cierre.motivo === 'recuperado' ? deLocal(cierre.recuperado) : null, evid: cierre.motivo === 'recuperado' ? cierre.evid : null };
      d.solicitudes.filter(s => s.caso === c.id && vigenteSol(s, t2)).forEach(s => { s.estado = 'retirada'; s.retiro = { t: t2, motivo: 'Caso cerrado' }; });
      d.gestiones.push(gestion(c.id, u.id, t2, 'Cierre del caso', `Motivo: ${MOTIVOS[cierre.motivo]}.`, 'afectado'));
      notificar(d, t2, c, `Tu caso ${c.folio} se cerró. Motivo: ${MOTIVOS[cierre.motivo]}.`);
      auditar(d, t2, u.id, 'Cerrar caso', `Caso ${c.folio}: ${MOTIVOS[cierre.motivo]}`);
    });
    setConfirmarCierre(false); avisar('Caso cerrado');
  }
  const evRecibidas = evs.filter(e => e.estado === 'recibido');

  return html`
    <div><button className="link" onClick=${volver}>← Bandeja</button></div>
    <div className="titulo-pag"><div className="pila-s"><span className="eyebrow">Caso · ${TIPOS[k.tipo]}</span><h1 className="mono" style=${{ fontFamily: 'var(--f-mono)', fontSize: '28px', fontWeight: 500 }}>${k.folio}</h1>
      <div className="fila"><${Insignia} tipo="estado" valor=${k.estado} /><${Insignia} tipo="prioridad" valor=${k.prioridad} /><${Insignia} tipo="denuncia" valor=${k.denuncia} /></div></div>
      ${!cerrado ? html`<div className="fila">
        <label className="campo"><span>Prioridad (urgencia)</span><select id="dc-prioridad" className="inp" value=${k.prioridad} onChange=${e => prioridad(e.target.value)}>${Object.keys(PRIORIDADES).map(p => html`<option key=${p} value=${p}>${PRIORIDADES[p]}</option>`)}</select></label>
        ${sig && sig !== 'cerrado' ? html`<button className="btn btn-p" style=${{ alignSelf: 'flex-end' }} onClick=${avanzar}>Pasar a ${ESTADOS[sig]}</button>` : null}
        <button className="btn" style=${{ alignSelf: 'flex-end' }} onClick=${() => irBusqueda(k.id)}>Búsqueda asistida</button>
      </div>` : null}
    </div>
    <div className="col2">
      <div className="pila">
        <div className="card"><div className="card-cab"><h3>Datos del reporte</h3><span className="small quiet">Ámbito institucional</span></div>
          <dl className="dato">
            <dt>Persona afectada</dt><dd>${rep.nombre}</dd>
            <dt>Vehículo</dt><dd>${vehTxt(v)} · <span className="mono">${v.patente}</span></dd>
            <dt>Hecho</dt><dd>${fFecha(k.hecho)}</dd>
            <dt>Recibido</dt><dd>${fFecha(k.creado)} · ${hace(k.creado, t)}</dd>
            <dt>Sector</dt><dd>${nombreSector(k.zona)} · ±${k.precision} m</dd>
            <dt>Denuncia</dt><dd>${DENUNCIA[k.denuncia]}${k.refDenuncia ? ` · ${k.refDenuncia}` : ''} ${k.denuncia === 'declarada' && !cerrado ? html`<button className="link" onClick=${verificarDenuncia}>Marcar verificada</button>` : null}</dd>
            <dt>Relato privado</dt><dd>${k.relato}</dd>
          </dl></div>
        <div className="card pila-s"><div className="card-cab" style=${{ marginBottom: 0 }}><h3>Ubicación exacta</h3><span className="small quiet">Sólo visible para la institución</span></div>
          <${Mapa} punto=${{ x: k.x, y: k.y }} precision=${k.precision} extras=${aps.map(a => ({ x: a.x, y: a.y }))} />
          <p className="ayuda">Punto azul: lugar del hecho. Puntos grises: avistamientos informados.</p></div>
        <div className="card pila-s"><div className="card-cab" style=${{ marginBottom: 0 }}><h3>Bitácora</h3><span className="small quiet">Sólo se agregan entradas</span></div>
          <ul className="bitacora">${gest.map(x => html`<li key=${x.id}><span><strong>${x.accion}</strong> · ${x.desc}</span><span className=${'b ' + (x.visible === 'afectado' ? 'b-info' : '')}>${x.visible === 'afectado' ? 'Visible al afectado' : 'Interna'}</span><small>${fFecha(x.t)} · ${usuario(db, x.u).nombre}</small></li>`)}</ul>
          ${!cerrado ? html`<form className="pila-s" onSubmit=${agregarGestion} style=${{ borderTop: '1px solid var(--line)', paddingTop: '12px' }}>
            <div className="col2b"><label className="campo"><span>Acción</span><select id="dc-accion" className="inp" value=${g.accion} onChange=${e => setG(Object.assign({}, g, { accion: e.target.value }))}>${ACCIONES_GESTION.map(a => html`<option key=${a}>${a}</option>`)}</select></label>
            <label className="campo"><span>Descripción</span><input id="dc-desc" className="inp" value=${g.desc} onChange=${e => setG(Object.assign({}, g, { desc: e.target.value }))} /></label></div>
            <div className="entre"><label className="check"><input id="dc-visible" type="checkbox" checked=${g.visible} onChange=${e => setG(Object.assign({}, g, { visible: e.target.checked }))} />Visible para la persona afectada</label><button className="btn btn-p btn-s" type="submit">Agregar gestión</button></div>
            ${errG ? html`<p className="error">${errG}</p>` : null}
          </form>` : null}
        </div>
      </div>
      <div className="pila">
        <div className="card pila-s"><h3>Responsable</h3>
          <p>${k.asignado ? html`<strong>${usuario(db, k.asignado).nombre}</strong> · asignación vigente` : html`<span className="b b-warn">Sin responsable</span>`}</p>
          ${!cerrado ? (esSup ? html`<div className="fila"><select id="dc-resp" className="inp" style=${{ flex: '1 1 160px' }} value=${nuevoResp} onChange=${e => setNuevoResp(e.target.value)}><option value="">Elegir miembro…</option>${miembros.map(m => html`<option key=${m.id} value=${m.id}>${m.nombre}</option>`)}</select><button className="btn" onClick=${asignar}>Asignar</button></div><p className="ayuda">Una sola asignación vigente: al reasignar, la anterior se cierra.</p>`
            : html`<p className="ayuda">Sólo un supervisor de ${org.nombre} puede asignar o reasignar.</p>`) : null}
        </div>
        <div className="card pila-s"><h3>Solicitud de colaboración</h3>
          ${solVig ? html`<div className="aviso aviso-good"><strong>Publicada · ${quedan(solVig.vence, t)}</strong><span>Zona: ${nombreSector(solVig.zona)} · hasta ${fFecha(solVig.vence)}</span><span className="small">«${solVig.texto}»</span></div>
            ${retiro ? html`<div className="pila-s"><label className="campo"><span>Motivo del retiro</span><input id="dc-retiro" className="inp" value=${retiro.motivo} onChange=${e => setRetiro(Object.assign({}, retiro, { motivo: e.target.value }))} /></label>${retiro.err ? html`<p className="error">${retiro.err}</p>` : null}<div className="fila"><button className="btn btn-d" onClick=${retirar}>Retirar ahora</button><button className="btn" onClick=${() => setRetiro(null)}>Cancelar</button></div></div>`
              : html`<button className="btn btn-d btn-s" onClick=${() => setRetiro({ id: solVig.id, motivo: '' })}>Retirar solicitud</button>`}`
          : cerrado ? html`<p className="small quiet">El caso está cerrado.</p>`
          : solF ? html`<form className="pila-s" onSubmit=${publicar}>
              <label className="campo"><span>Zona publicable (nunca la dirección)</span><select id="sf-zona" className="inp" value=${solF.zona} onChange=${e => setSolF(Object.assign({}, solF, { zona: e.target.value }))}>${SECTORES.map(s => html`<option key=${s.id} value=${s.id}>${s.nombre}</option>`)}</select></label>
              <label className="campo"><span>Texto aprobado</span><textarea id="sf-texto" className="inp" value=${solF.texto} onChange=${e => setSolF(Object.assign({}, solF, { texto: e.target.value }))}></textarea></label>
              <label className="campo"><span>Vence (obligatorio)</span><input id="sf-vence" className="inp" type="datetime-local" min=${aLocal(t)} value=${solF.vence} onChange=${e => setSolF(Object.assign({}, solF, { vence: e.target.value }))} /></label>
              <label className="campo"><span>Motivo de la autorización</span><input id="sf-motivo" className="inp" value=${solF.motivo} onChange=${e => setSolF(Object.assign({}, solF, { motivo: e.target.value }))} /></label>
              <div className="aviso aviso-neutro small"><span className="eyebrow">Así lo verá la ciudadanía</span><strong>${vehTxt(v)} · ${v.patente}</strong><span>Sector: ${nombreSector(solF.zona)} · ${quedan(deLocal(solF.vence) || t, t)}</span><span>«${solF.texto}»</span></div>
              <p className="ayuda">Nunca se publica: dirección, coordenadas exactas, relato privado ni recomendaciones de búsqueda.</p>
              ${solF.err ? html`<p className="error">${solF.err}</p>` : null}
              <div className="fila"><button className="btn btn-p" type="submit">Publicar</button><button type="button" className="btn" onClick=${() => setSolF(null)}>Cancelar</button></div>
            </form>`
          : html`<p className="small quiet">No hay una solicitud vigente para este caso.</p><button className="btn btn-s" onClick=${() => setSolF({ zona: k.zona, texto: `${vehTxt(v)}, patente ${v.patente}. Si lo ves, no lo sigas ni intervengas: informa en la app.`, vence: aLocal(t + 3 * DIA), motivo: '' })}>Preparar solicitud</button>`}
          ${sols.filter(s => s !== solVig).length ? html`<p className="ayuda">Anteriores: ${sols.filter(s => s !== solVig).map(s => `${estadoSol(s, t)} el ${fDia(s.retiro ? s.retiro.t : s.vence)}`).join(' · ')}</p>` : null}
        </div>
        <div className="card pila-s"><h3>Avistamientos del caso</h3>
          ${aps.length ? aps.map(a => html`<div key=${a.id} className="entre small"><span>Aporte #${a.num} · ${hace(a.rec, t)}</span><span className="fila"><${Insignia} tipo="aporte" valor=${a.estado} /><button className="link" onClick=${() => irAporte(a.id)}>${a.estado === 'pendiente' ? 'Revisar' : 'Ver'}</button></span></div>`) : html`<p className="small quiet">Sin aportes todavía.</p>`}
        </div>
        <div className="card pila-s"><h3>Evidencia</h3>
          ${evs.length ? evs.map(e => html`<${FilaEvidencia} key=${e.id} e=${e} />`) : html`<p className="small quiet">Sin archivos.</p>`}
          ${!cerrado ? html`<${Subir} etiqueta="Adjuntar respaldo" onArchivo=${adjuntar} />` : null}
          <p className="ayuda">La huella detecta si un archivo cambió, pero no prueba que la escena sea verdadera.</p>
        </div>
        <div className="card pila-s"><h3>${cerrado ? 'Cierre' : 'Cerrar caso'}</h3>
          ${cerrado ? html`<p>Motivo: <strong>${MOTIVOS[k.cierre.motivo]}</strong> · ${fFecha(k.cierre.t)}</p>${k.cierre.recuperado ? html`<p className="small">Recuperado el ${fFecha(k.cierre.recuperado)} · respaldo: ${(db.evidencias.find(e => e.id === k.cierre.evid) || {}).nombre || '—'}</p>` : null}`
          : html`
            <label className="campo"><span>Motivo</span><select id="cc-motivo" className="inp" value=${cierre.motivo} onChange=${e => setCierre(Object.assign({}, cierre, { motivo: e.target.value }))}><option value="">Elegir motivo…</option>${Object.keys(MOTIVOS).map(m => html`<option key=${m} value=${m}>${MOTIVOS[m]}</option>`)}</select></label>
            ${cierre.motivo === 'recuperado' ? html`
              <label className="campo"><span>Fecha de recuperación</span><input id="cc-fecha" className="inp" type="datetime-local" max=${aLocal(t)} value=${cierre.recuperado} onChange=${e => setCierre(Object.assign({}, cierre, { recuperado: e.target.value }))} /></label>
              <label className="campo"><span>Evidencia de respaldo (de este caso)</span><select id="cc-evid" className="inp" value=${cierre.evid} onChange=${e => setCierre(Object.assign({}, cierre, { evid: e.target.value }))}><option value="">${evRecibidas.length ? 'Elegir evidencia…' : 'No hay evidencia recibida'}</option>${evRecibidas.map(e => html`<option key=${e.id} value=${e.id}>${e.nombre}</option>`)}</select></label>` : null}
            <p className="ayuda">Un avistamiento aceptado no es una recuperación.</p>
            ${errC.length ? html`<div className="aviso aviso-bad">${errC.map((x, i) => html`<span key=${i}>${x}</span>`)}</div>` : null}
            ${confirmarCierre ? html`<div className="fila"><span className="small">¿Cerrar el caso? Se avisará a la persona afectada.</span><button className="btn btn-d" onClick=${cerrar}>Sí, cerrar</button><button className="btn" onClick=${() => setConfirmarCierre(false)}>Cancelar</button></div>`
              : html`<button className="btn btn-d" onClick=${() => { const e = validarCierre(); setErrC(e); if (!e.length) setConfirmarCierre(true); }}>Cerrar caso</button>`}`}
        </div>
      </div>
    </div>`;
}

function Avistamientos({ db, act, u, org, sel, setSel, abrirCaso, avisar }) {
  const t = Date.now();
  const todos = db.aportes.filter(a => caso(db, a.caso).org === org.id);
  const seleccionado = todos.find(a => a.id === sel);
  const [ver, setVer] = useState(() => seleccionado && seleccionado.estado !== 'pendiente' ? 'revisados' : 'pendientes');
  const lista = ver === 'pendientes' ? todos.filter(a => a.estado === 'pendiente').sort((a, b) => a.rec - b.rec) : todos.filter(a => a.estado !== 'pendiente').sort((a, b) => b.rec - a.rec);
  const actual = seleccionado && lista.includes(seleccionado) ? seleccionado : lista[0];
  return html`
    <div className="titulo-pag"><div><h1>Avistamientos</h1><p>Cada aporte llega pendiente. Una persona decide, siempre con motivo, y la decisión queda en un historial que no se edita.</p></div>
      <div className="tabs" style=${{ minWidth: '260px' }} role="tablist"><button role="tab" aria-selected=${ver === 'pendientes'} onClick=${() => setVer('pendientes')}>Por revisar (${todos.filter(a => a.estado === 'pendiente').length})</button><button role="tab" aria-selected=${ver === 'revisados'} onClick=${() => setVer('revisados')}>Revisados</button></div></div>
    ${!lista.length ? html`<p className="aviso aviso-neutro">${ver === 'pendientes' ? 'No hay aportes por revisar.' : 'Aún no hay aportes revisados.'}</p>` : html`
    <div className="cola">
      <div className="pila-s">${lista.map(a => { const k = caso(db, a.caso); return html`<button key=${a.id} className="cola-item" aria-current=${actual && actual.id === a.id ? 'true' : 'false'} onClick=${() => setSel(a.id)}><div className="entre"><strong>Aporte #${a.num}</strong><${Insignia} tipo="aporte" valor=${a.estado} /></div><span className="small mono">${k.folio}</span><span className="small quiet">Recibido ${hace(a.rec, t)}</span></button>`; })}</div>
      ${actual ? html`<${RevisionAporte} key=${actual.id + actual.revisiones.length} db=${db} act=${act} u=${u} a=${actual} abrirCaso=${abrirCaso} avisar=${avisar} />` : null}
    </div>`}`;
}

function RevisionAporte({ db, act, u, a, abrirCaso, avisar }) {
  const t = Date.now();
  const k = caso(db, a.caso); const v = veh(db, k.veh);
  const foto = a.foto ? db.evidencias.find(e => e.id === a.foto) : null;
  const otros = db.aportes.filter(x => x.caso === a.caso && x.id !== a.id);
  const dup = otros.map(x => ({ x, m: distanciaM(a, x), dt: Math.abs(a.obs - x.obs) / MIN })).filter(o => o.m <= 600 && o.dt <= 30).sort((p, q) => p.m - q.m)[0];
  const [f, setF] = useState({ decision: '', motivo: '', resumen: '' });
  const [err, setErr] = useState('');
  const [rectificar, setRectificar] = useState(false);
  const editable = a.estado === 'pendiente' || rectificar;
  function guardar() {
    setErr('');
    if (!f.decision) return setErr('Elige una decisión.');
    if (f.motivo.trim().length < 5) return setErr('La decisión exige un motivo (al menos 5 caracteres).');
    const m = membresiaActiva(db, u.id);
    if (!m || m.org !== k.org) return setErr('Sólo un miembro activo de la organización del caso puede decidir.');
    act((d, t2) => {
      const x = d.aportes.find(z => z.id === a.id); const c = caso(d, x.caso);
      x.revisiones.push({ u: u.id, decision: f.decision, motivo: f.motivo.trim(), t: t2 }); x.estado = f.decision;
      if (f.resumen.trim()) x.resumen = f.resumen.trim();
      d.gestiones.push(gestion(c.id, u.id, t2, 'Revisión de aporte', `Aporte #${x.num}: ${DECISIONES[f.decision]}. Motivo: ${f.motivo.trim()}`));
      if (f.resumen.trim()) notificar(d, t2, c, f.resumen.trim());
      auditar(d, t2, u.id, rectificar ? 'Rectificar revisión' : 'Revisar avistamiento', `Aporte #${x.num} · ${DECISIONES[f.decision]}`);
    });
    avisar(rectificar ? 'Rectificación agregada al historial' : 'Decisión guardada con su motivo');
  }
  return html`<div className="card pila">
    <div className="entre"><div><span className="eyebrow">Aporte #${a.num}</span><h3>${vehTxt(v)} · <span className="mono">${v.patente}</span></h3></div><button className="link mono" onClick=${() => abrirCaso(k.id)}>${k.folio}</button></div>
    <dl className="dato"><dt>Observado</dt><dd>${fFecha(a.obs)}</dd><dt>Recibido</dt><dd>${fFecha(a.rec)} · ${hace(a.rec, t)}</dd><dt>Informado por</dt><dd>${usuario(db, a.u).nombre}</dd><dt>Sector</dt><dd>${nombreSector(sectorDe(a.x, a.y))} · ±${a.precision} m</dd><dt>Observación</dt><dd>${a.desc}</dd></dl>
    <${Mapa} punto=${{ x: a.x, y: a.y }} precision=${a.precision} extras=${otros.map(x => ({ x: x.x, y: x.y })).concat([{ x: k.x, y: k.y }])} />
    ${foto ? html`<${FilaEvidencia} e=${foto} />` : null}
    ${dup ? html`<div className="aviso aviso-warn"><strong>Posible duplicado</strong><span>Aporte #${dup.x.num}, a ${dup.m} m y ${Math.round(dup.dt)} min de diferencia. El sistema avisa; la decisión es tuya.</span></div>` : null}
    ${a.revisiones.length ? html`<div className="pila-s"><span className="eyebrow">Historial de decisiones</span>${a.revisiones.map((r, i) => html`<div key=${i} className="ev"><span className="ev-n">${DECISIONES[r.decision]}</span><span className="small quiet">${fFecha(r.t)}</span><small>${usuario(db, r.u).nombre} · ${r.motivo}</small></div>`)}${a.resumen ? html`<p className="small">Resumen para el afectado: «${a.resumen}»</p>` : null}</div>` : null}
    ${editable ? html`<div className="pila-s" style=${{ borderTop: '1px solid var(--line)', paddingTop: '12px' }}>
      <span className="eyebrow">${rectificar ? 'Rectificación: se agrega, no reemplaza' : 'Decisión'}</span>
      <div className="chips">${['aceptado', 'rechazado', 'requiere_aclaracion'].map(dk => html`<button key=${dk} type="button" className="chip" aria-pressed=${f.decision === dk} onClick=${() => setF(Object.assign({}, f, { decision: dk }))}>${{ aceptado: 'Aceptar', rechazado: 'Rechazar', requiere_aclaracion: 'Pedir aclaración' }[dk]}</button>`)}</div>
      <label className="campo"><span>Motivo (obligatorio)</span><input id="rv-motivo" className="inp" value=${f.motivo} onChange=${e => setF(Object.assign({}, f, { motivo: e.target.value }))} placeholder="Por qué decides esto" /></label>
      <label className="campo"><span>Resumen para la persona afectada (opcional)</span><input id="rv-resumen" className="inp" value=${f.resumen} onChange=${e => setF(Object.assign({}, f, { resumen: e.target.value }))} placeholder="Ej.: Se revisó un aporte en tu sector." /><span className="ayuda">Sin dirección ni datos de quien informó.</span></label>
      ${err ? html`<p className="error" role="alert">${err}</p>` : null}
      <div className="fila"><button className="btn btn-p" onClick=${guardar}>Guardar decisión</button>${rectificar ? html`<button className="btn" onClick=${() => setRectificar(false)}>Cancelar</button>` : null}</div>
    </div>` : html`<button className="btn btn-s" onClick=${() => setRectificar(true)}>Rectificar decisión</button>`}
  </div>`;
}

function Solicitudes({ db, act, u, org, abrirCaso, avisar }) {
  const t = Date.now();
  const lista = db.solicitudes.filter(s => caso(db, s.caso).org === org.id).sort((a, b) => b.inicio - a.inicio);
  return html`
    <div className="titulo-pag"><div><h1>Solicitudes de colaboración</h1><p>Lo que ve la red ciudadana: datos mínimos, con vencimiento. Se publican y retiran desde el detalle de cada caso.</p></div></div>
    <div className="tabla-wrap"><table>
      <thead><tr><th>Caso</th><th>Vehículo</th><th>Zona publicable</th><th>Estado</th><th>Publicada</th><th>Vence</th><th>Aportes</th></tr></thead>
      <tbody>${lista.map(s => { const k = caso(db, s.caso); const v = veh(db, k.veh); return html`<tr key=${s.id}><td><button className="link mono" onClick=${() => abrirCaso(k.id)}>${k.folio}</button></td><td>${vehTxt(v)} · <span className="mono">${v.patente}</span></td><td>${nombreSector(s.zona)}</td><td><${Insignia} tipo="solicitud" valor=${estadoSol(s, t)} /></td><td className="num">${fFecha(s.inicio)}</td><td className="num">${fFecha(s.vence)}</td><td className="num">${db.aportes.filter(a => a.sol === s.id).length}</td></tr>`; })}</tbody>
    </table></div>`;
}

function Indicadores({ db, org }) {
  const t = Date.now();
  const [dias, setDias] = useState(30);
  const desde = t - dias * DIA;
  const base = db.casos.filter(c => (org ? c.org === org.id : true) && c.creado >= desde);
  const eleg = base.filter(c => !(c.cierre && c.cierre.motivo === 'duplicado'));
  const porSector = SECTORES.map(s => ({ l: s.nombre, n: eleg.filter(c => c.zona === s.id).length }));
  const porTipo = Object.keys(TIPOS).map(k => ({ l: TIPOS[k], n: eleg.filter(c => c.tipo === k).length }));
  const aps = db.aportes.filter(a => eleg.some(c => c.id === a.caso));
  const tiempos = [], pend = [];
  eleg.forEach(c => { const g = db.gestiones.filter(x => x.caso === c.id && x.accion === 'Primera revisión').sort((a, b) => a.t - b.t)[0]; if (g) tiempos.push((g.t - c.creado) / MIN); else if (c.estado !== 'cerrado') pend.push(c); });
  const recup = eleg.filter(c => c.cierre && c.cierre.motivo === 'recuperado' && c.cierre.evid);
  const max = xs => Math.max(1, ...xs.map(x => x.n));
  const Barras = ({ datos }) => html`<div className="pila-s">${datos.map((d, i) => html`<div key=${i} className="barra-ind"><span>${d.l}</span><div className="pista"><div style=${{ width: `${d.n / max(datos) * 100}%` }}></div></div><span className="num" style=${{ textAlign: 'right' }}>${d.n}</span></div>`)}</div>`;
  const Pie = ({ num, den, lim }) => html`<div className="ind-pie"><span>Numerador: ${num}</span><span>Denominador: ${den}</span><span>Corte: ${fFecha(t)}</span><span>Definición: versión 1 · entorno prueba</span><span style=${{ gridColumn: '1 / -1' }}>Limitación: ${lim}</span></div>`;
  return html`
    <div className="titulo-pag"><div><h1>Indicadores</h1><p>Calculados en vivo con los datos de esta demostración${org ? ` de ${org.nombre}` : ' de todas las organizaciones'}. Cuando falta base para calcular, se dice en vez de mostrar un cero.</p></div>
      <label className="campo"><span>Período</span><select id="ind-dias" className="inp" value=${dias} onChange=${e => setDias(Number(e.target.value))}><option value="7">Últimos 7 días</option><option value="30">Últimos 30 días</option><option value="90">Últimos 90 días</option></select></label></div>
    <div className="col2b">
      <div className="card pila-s"><span className="eyebrow">M01</span><h3>Casos por sector</h3>${eleg.length ? html`<${Barras} datos=${porSector} />` : html`<p className="aviso aviso-warn">Sin información suficiente en el período.</p>`}<${Pie} num="casos únicos por sector" den=${`${eleg.length} casos elegibles (sin duplicados)`} lim="cuenta reportes, no la criminalidad real." /></div>
      <div className="card pila-s"><span className="eyebrow">M05</span><h3>Tipo de incidente</h3>${eleg.length ? html`<${Barras} datos=${porTipo} />` : html`<p className="aviso aviso-warn">Sin información suficiente en el período.</p>`}<${Pie} num="casos por tipo" den=${`${eleg.length} casos elegibles`} lim="la clasificación la elige la persona y es revisable." /></div>
      <div className="card pila-s"><span className="eyebrow">M09</span><h3>Primera revisión</h3>
        ${tiempos.length ? html`<div className="fila" style=${{ gap: '28px' }}><div><span className="grande">${redondeo(mediana(tiempos))}</span> <span className="quiet">min · mediana</span></div><div><span className="grande">${redondeo(percentil(tiempos, 95))}</span> <span className="quiet">min · p95</span></div></div>` : html`<p className="aviso aviso-warn"><strong>Sin información suficiente</strong><span>No hay casos con primera revisión en el período.</span></p>`}
